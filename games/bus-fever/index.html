<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bus Fever · 10 niveles</title>
<style>
  :root {
    --bg:#fdfaf2; --ink:#2e473f; --panel:#ffffff; --line:#e6dfcf; --muted:#7d877f; --text:#26332d;
    --star:#f4a320; --star-off:#ddd6c4; --green:#3f8a52; --red:#d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14201c; --ink:#cfe3d8; --panel:#1f2e29; --line:#33463e; --muted:#8fa299; --text:#e8f1ec;
      --star-off:#3a4a43; --green:#5fcf85; --red:#ff7a72;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14201c; --ink:#cfe3d8; --panel:#1f2e29; --line:#33463e; --muted:#8fa299; --text:#e8f1ec;
    --star-off:#3a4a43; --green:#5fcf85; --red:#ff7a72;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; overscroll-behavior:none; touch-action:manipulation; }
  #app { max-width:520px; margin:0 auto; height:100%; display:flex; flex-direction:column; padding:10px 16px 14px; }
  .screen { display:none; flex:1; flex-direction:column; min-height:0; }
  .screen.on { display:flex; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-height:44px; cursor:pointer; }
  button:active { transform:scale(.96); }
  button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:bold; }
  button:disabled { opacity:.4; }

  /* menú */
  h1 { font-size:22px; margin:14px 0 6px; text-align:center; color:var(--ink); }
  .intro { text-align:center; color:var(--muted); margin:0 0 18px; line-height:1.4; font-size:14px; }
  #grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  #grid button { padding:14px 0; font-size:18px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  #grid button small { font-size:12px; color:var(--star); letter-spacing:1px; min-height:14px; }
  #grid button.locked { opacity:.35; }

  /* juego */
  .top { display:flex; align-items:center; justify-content:space-between; min-height:44px; }
  .top .side { width:64px; }
  .top .side:last-child { text-align:right; color:var(--muted); font-size:13px; }
  #menuBtn { padding:6px 10px; font-size:16px; min-width:44px; }
  #stars { display:flex; gap:6px; font-size:28px; line-height:1; }
  #stars span { color:var(--star); transition:color .25s, transform .25s; }
  #stars span.off { color:var(--star-off); transform:scale(.85); }
  #boardWrap { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #noGL { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--muted); }
  #info { text-align:center; color:var(--muted); font-size:12px; min-height:16px; }
  #msg { text-align:center; color:var(--muted); font-size:13px; min-height:18px; margin-bottom:4px; }
  .bottom { display:flex; justify-content:center; padding-top:6px; gap:12px; }
  .bottom .tool { width:58px; height:58px; padding:0; border-radius:16px; font-size:24px; position:relative; }
  #hintBtn { position:relative; width:58px; height:58px; padding:0; border-radius:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  #hintBtn svg { width:30px; height:30px; }
  #hintCount { position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; border-radius:11px; background:#5cb82a; color:#fff; font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center; padding:0 5px; border:2px solid var(--bg); }

  /* ventana de fin de nivel */
  #overlay { position:fixed; inset:0; background:rgba(20,32,28,.55); display:none; align-items:center; justify-content:center; padding:24px; }
  #overlay.on { display:flex; }
  .card { background:var(--panel); border-radius:18px; padding:22px; width:100%; max-width:340px; text-align:center; border:1px solid var(--line); }
  .card h2 { margin:0 0 6px; color:var(--ink); }
  .big-stars { font-size:36px; color:var(--star); letter-spacing:4px; margin:8px 0; }
  .card .row { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="app">
  <section id="sMenu" class="screen on">
    <h1>Bus Fever</h1>
    <p class="intro">Toca un autobús con el camino libre para llevarlo a una bahía.<br>Los pasajeros suben al autobús de su color. Si las bahías se llenan y nadie puede subir, pierdes.</p>
    <div id="grid"></div>
  </section>
  <section id="sGame" class="screen">
    <div class="top">
      <div class="side"><button id="menuBtn" aria-label="Niveles">☰</button></div>
      <div id="stars"><span>★</span><span>★</span><span>★</span></div>
      <div class="side">Nivel <b id="lvNum">1</b></div>
    </div>
    <div id="boardWrap"><canvas id="cv"></canvas><div id="noGL">No se pudo iniciar el modo 3D en este dispositivo.</div></div>
    <div id="info"></div>
    <div id="msg"></div>
    <div class="bottom">
      <button id="undoBtn" class="tool" aria-label="Deshacer">↶</button>
      <button id="restartBtn" class="tool" aria-label="Reiniciar">⟳</button>
      <button id="hintBtn" aria-label="Pista">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3f8a52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" fill="#3f8a52" fill-opacity=".85"/>
        </svg>
        <span id="hintCount">3</span>
      </button>
    </div>
  </section>
</div>
<div id="overlay"><div class="card">
  <h2 id="ovTitle">¡Nivel completo!</h2>
  <div class="big-stars" id="ovStars"></div>
  <div id="ovInfo" style="color:var(--muted)"></div>
  <div class="row">
    <button id="bMenu">Niveles</button>
    <button id="bUndo">Deshacer</button>
    <button id="bRetry">Repetir</button>
    <button id="bNext" class="primary">Siguiente</button>
  </div>
</div></div>
<script src="../_sdk/arcade-sdk.js" data-game="bus-fever"></script>
<script src="../_sdk/three.min.js"></script>
<script src="logic.js"></script>
<script src="levels.js"></script>
<script>
(function () {
  "use strict";
  const L = window.Logic, LEVELS = window.LEVELS_DATA, HINTS = 3;

  /* Anuncios: los gestiona la app (frecuencia, consentimiento, AdMob). El juego solo los pide. */
  const Ads = {
    interstitial: function () { return Arcade.ads.interstitial(); },
    rewarded: function () { return Arcade.ads.rewarded(); }
  };

  /* ---------- Progreso guardado (lo persiste y sincroniza la app mediante el SDK) ---------- */
  let progress = { stars: {}, completed: 0 };
  const levelsDone = () => Object.keys(progress.stars).length;
  const totalStars = () => Object.keys(progress.stars).reduce(function (n, k) { return n + (progress.stars[k] || 0); }, 0);
  function save() { Arcade.save(progress, { progress: { value: levelsDone(), total: LEVELS.length } }); }

  const $ = (id) => document.getElementById(id);
  const sMenu = $("sMenu"), sGame = $("sGame"), cv = $("cv"), overlay = $("overlay");
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const PAL = ["#e0524d", "#3d7be0", "#3fae5a", "#f1c232", "#9c5bd6", "#f08a2c"];

  let cur = 0, lv = null, st = null, hist = [], hints = HINTS, hintMove = -1, over = false, aids = 0, raf = 0;

  function buildMenu() {
    const g = $("grid"); g.innerHTML = "";
    LEVELS.forEach((l, i) => {
      const unlocked = i === 0 || progress.stars[i - 1] !== undefined;
      const s = progress.stars[i] || 0;
      const b = document.createElement("button");
      b.innerHTML = (i + 1) + "<small>" + (s ? "★".repeat(s) + "☆".repeat(3 - s) : "") + "</small>";
      if (!unlocked) { b.className = "locked"; b.disabled = true; }
      b.onclick = () => startLevel(i);
      g.appendChild(b);
    });
  }
  function show(screen) { sMenu.classList.toggle("on", screen === "menu"); sGame.classList.toggle("on", screen === "game"); }

  function startLevel(i) {
    cur = i; lv = LEVELS[i]; st = L.init(lv); hist = []; hints = HINTS; hintMove = -1; over = false; aids = 0;
    overlay.classList.remove("on"); $("msg").textContent = ""; $("lvNum").textContent = lv.id;
    show("game"); updateHud();
    if (!initGL()) return;
    buildScene();
    resize();
    kick();
  }
  function stars() { return aids === 0 ? 3 : aids <= 2 ? 2 : 1; }
  function updateHud() {
    [...$("stars").children].forEach((e, k) => e.classList.toggle("off", k >= stars()));
    $("hintCount").textContent = hints;
    $("hintBtn").disabled = hints <= 0 || over;
    $("undoBtn").disabled = !hist.length || over;
    if (lv && st) {
      const free = st.bays.filter((b) => !b).length;
      $("info").textContent = "Pasajeros en espera: " + (lv.queue.length - st.qi) + " · Bahías libres: " + free;
    }
  }

  /* =====================================================================
   * Presentación 3D (three.js, vendorizado en ../_sdk/three.min.js)
   * Unidades del mundo: 1 celda = 1. x = columna, z = fila, y = altura.
   * Arriba el estacionamiento, en medio la fila de pasajeros, abajo las bahías.
   * ===================================================================== */
  const ELEV = 56, BAY_W = 1.8, BUS_W = 0.78, BUS_H = 0.62, Y_PICK = 0.35;
  let renderer = null, scene, camera, hemi, sun, boardGroup, busGroup, queueGroup, bayGroup, plane;
  let glOk = null, T = {};
  let busMat = [], symMat = [], symTex = [], glassMat, wheelMat, lightMat, markGreen, markRed, seatOn, seatOff, ringMat;
  let geoCyl, geoSph, geoPlane, geoRing, bodyGeos = {}, glassGeos = {}, markGeos = {};
  let buses = [], bays = [], zc = 0, dims = null, qKey = "", bKey = "", mark = 0;

  /* Símbolo por color (ayuda a distinguir sin depender solo del color) */
  function symbolTexture(k) {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.translate(32, 32); g.beginPath();
    if (k === 0) g.arc(0, 0, 20, 0, 7);
    else if (k === 1) { g.moveTo(0, -22); g.lineTo(22, 18); g.lineTo(-22, 18); }
    else if (k === 2) g.rect(-18, -18, 36, 36);
    else if (k === 3) { g.moveTo(0, -24); g.lineTo(22, 0); g.lineTo(0, 24); g.lineTo(-22, 0); }
    else if (k === 4) { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 11 : 24; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } }
    else { g.rect(-7, -22, 14, 44); g.rect(-22, -7, 44, 14); }
    g.closePath(); g.fill();
    const t = new THREE.CanvasTexture(c); return t;
  }

  function initGL() {
    if (glOk !== null) return glOk;
    try {
      if (!window.THREE) throw new Error("three.js no cargó");
      renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setClearColor(0x000000, 0);
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(30, 1, 0.5, 300);
      hemi = new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.7); scene.add(hemi);
      sun = new THREE.DirectionalLight(0xffffff, 0.72);
      sun.position.set(-4, 12, 6); sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0008;
      scene.add(sun, sun.target);
      boardGroup = new THREE.Group(); busGroup = new THREE.Group(); queueGroup = new THREE.Group(); bayGroup = new THREE.Group();
      scene.add(boardGroup, busGroup, queueGroup, bayGroup);
      geoCyl = new THREE.CylinderGeometry(1, 1, 1, 14);
      geoSph = new THREE.SphereGeometry(1, 16, 12);
      geoPlane = new THREE.PlaneGeometry(1, 1); geoPlane.rotateX(-Math.PI / 2);
      geoRing = new THREE.RingGeometry(0.36, 0.46, 24); geoRing.rotateX(-Math.PI / 2);
      for (let k = 0; k < PAL.length; k++) {
        busMat[k] = new THREE.MeshStandardMaterial({ color: PAL[k], roughness: 0.5, metalness: 0.05 });
        symTex[k] = symbolTexture(k);
        symMat[k] = new THREE.MeshBasicMaterial({ map: symTex[k], transparent: true, depthWrite: false });
      }
      glassMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a, roughness: 0.25, metalness: 0.2 });
      wheelMat = new THREE.MeshStandardMaterial({ color: 0x23272b, roughness: 0.8 });
      lightMat = new THREE.MeshBasicMaterial({ color: 0xfff1b0 });
      markGreen = new THREE.MeshBasicMaterial({ color: 0x3f8a52, transparent: true, opacity: 0.8, depthWrite: false });
      markRed = new THREE.MeshBasicMaterial({ color: 0xd9534f, transparent: true, opacity: 0.8, depthWrite: false });
      seatOn = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
      seatOff = new THREE.MeshStandardMaterial({ color: 0x3a4650, roughness: 0.7 });
      ringMat = new THREE.MeshBasicMaterial({ color: 0x2e473f, side: THREE.DoubleSide });
      plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -Y_PICK);
      cv.addEventListener("webglcontextlost", (e) => e.preventDefault());
      cv.addEventListener("webglcontextrestored", () => draw());
      glOk = true;
    } catch (err) {
      glOk = false; $("noGL").style.display = "flex"; cv.style.display = "none";
      if (window.console) console.warn("[bus-fever] WebGL no disponible:", err);
    }
    return glOk;
  }

  const wp = (r, c) => [c - (lv.w - 1) / 2, r - zc];   // celda -> [x, z]

  function readTheme() {
    T = { ink: cssVar("--ink") || "#2e473f", green: cssVar("--green") || "#3f8a52", red: cssVar("--red") || "#d9534f",
          panel: cssVar("--panel") || "#ffffff", line: cssVar("--line") || "#e6dfcf" };
    T.dark = new THREE.Color(cssVar("--bg") || "#fff").getHSL({}).l < 0.5;
    const k = T.dark ? 0.85 : 1;
    for (let i = 0; i < PAL.length; i++) busMat[i].color.set(PAL[i]).multiplyScalar(k);
    markGreen.color.set(T.green); markRed.color.set(T.red);
    ringMat.color.set(T.ink);
    seatOff.color.set(T.dark ? 0x4a5a64 : 0x3a4650);
  }

  function disposeGroup(g) {
    while (g.children.length) {
      const o = g.children.pop();
      if (o.userData.ownGeo && o.geometry) o.geometry.dispose();
      if (o.material && o.userData.ownMat) o.material.dispose();
    }
  }

  /* ---------- Autobús: caja con cabina de cristal, ruedas, faros y símbolo en el techo ---------- */
  // Local: eje X = largo (frente en +X), Y = arriba, Z = ancho.
  function bodyGeo(len) { return bodyGeos[len] || (bodyGeos[len] = new THREE.BoxGeometry(len - 0.14, BUS_H - 0.15, BUS_W)); }
  function glassGeo(len) { return glassGeos[len] || (glassGeos[len] = new THREE.BoxGeometry(len - 0.12, 0.17, BUS_W + 0.02)); }
  function markGeo() { return geoPlane; }
  function part(geo, mat, x, y, z, shadow) {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (shadow) m.castShadow = true; return m;
  }
  function makeBus(color, len, withMarks) {
    const g = new THREE.Group(), Lx = len - 0.14;
    g.add(part(bodyGeo(len), busMat[color], 0, 0.15 + (BUS_H - 0.15) / 2, 0, true));
    g.add(part(glassGeo(len), glassMat, 0, 0.47, 0, false));
    for (const sx of [-1, 1]) {
      const w = part(geoCyl, wheelMat, sx * (Lx / 2 - 0.28), 0.15, 0, true);
      w.scale.set(0.15, BUS_W + 0.1, 0.15); w.rotation.x = Math.PI / 2; g.add(w);
    }
    for (const sz of [-1, 1]) {
      const l = part(geoSph, lightMat, Lx / 2 - 0.02, 0.3, sz * 0.25, false); l.scale.setScalar(0.07); g.add(l);
    }
    const s = part(geoPlane, symMat[color], 0, BUS_H + 0.005, 0, false); s.scale.set(0.42, 1, 0.42); s.position.x = -0.1; g.add(s);
    const ws = part(geoPlane, glassMat, Lx / 2 - 0.17, BUS_H + 0.004, 0, false); ws.scale.set(0.24, 1, BUS_W - 0.14); g.add(ws);   // parabrisas: marca el frente
    if (withMarks) {
      const gm = part(geoPlane, markGreen, 0, 0.03, 0, false), rm = part(geoPlane, markRed, 0, 0.032, 0, false);
      gm.scale.set(Lx + 0.3, 1, BUS_W + 0.3); rm.scale.copy(gm.scale); gm.visible = rm.visible = false;
      g.add(gm, rm); g.userData.gm = gm; g.userData.rm = rm;
    }
    return g;
  }
  const busYaw = (b) => b.o === "H" ? (b.d > 0 ? 0 : Math.PI) : (b.d > 0 ? -Math.PI / 2 : Math.PI / 2);

  // Tablero base y autobuses del nivel actual
  function buildScene() {
    readTheme();
    disposeGroup(boardGroup);
    [busGroup, queueGroup, bayGroup].forEach((g) => { while (g.children.length) g.remove(g.children[g.children.length - 1]); });
    qKey = bKey = ""; bays = [];

    const slabW = Math.max(lv.w + 0.9, lv.bays * BAY_W + 0.6), slabD = lv.h + 4.6;
    zc = (-1.0 + lv.h + 3.6) / 2;                            // centro (en filas) del tablero completo
    const rq = lv.h + 0.55, rb = lv.h + 2.4;
    dims = { slabW, slabD, rq, rb };
    const asphalt = new THREE.Color(T.panel).lerp(new THREE.Color(T.ink), 0.16);
    const cellCol = new THREE.Color(T.panel).lerp(new THREE.Color(T.ink), 0.09);
    const strip = new THREE.Color(T.panel).lerp(new THREE.Color(T.ink), 0.06);

    const slab = new THREE.Mesh(new THREE.BoxGeometry(slabW, 0.5, slabD), new THREE.MeshStandardMaterial({ color: T.panel, roughness: 0.85 }));
    slab.position.y = -0.25; slab.receiveShadow = true; slab.userData = { ownGeo: true, ownMat: true };
    const rim = new THREE.Mesh(new THREE.BoxGeometry(slabW + 0.3, 0.3, slabD + 0.3), new THREE.MeshStandardMaterial({ color: T.line, roughness: 0.9 }));
    rim.position.y = -0.62; rim.userData = { ownGeo: true, ownMat: true };
    const pad = new THREE.Mesh(new THREE.BoxGeometry(lv.w + 0.3, 0.04, lv.h + 0.3), new THREE.MeshStandardMaterial({ color: asphalt, roughness: 0.95 }));
    pad.position.set(0, 0.02, (lv.h - 1) / 2 - zc); pad.receiveShadow = true; pad.userData = { ownGeo: true, ownMat: true };
    const cells = new THREE.InstancedMesh(new THREE.BoxGeometry(0.92, 0.02, 0.92), new THREE.MeshBasicMaterial({ color: cellCol }), lv.w * lv.h);
    const m4 = new THREE.Matrix4();
    for (let r = 0; r < lv.h; r++) for (let c = 0; c < lv.w; c++) { const p = wp(r, c); m4.setPosition(p[0], 0.045, p[1]); cells.setMatrixAt(r * lv.w + c, m4); }
    cells.userData = { ownGeo: true, ownMat: true };
    const qs = new THREE.Mesh(new THREE.BoxGeometry(slabW - 0.5, 0.03, 0.95), new THREE.MeshStandardMaterial({ color: strip, roughness: 0.9 }));
    qs.position.set(0, 0.015, rq - zc); qs.receiveShadow = true; qs.userData = { ownGeo: true, ownMat: true };
    const slots = new THREE.InstancedMesh(new THREE.BoxGeometry(BAY_W - 0.2, 0.03, 2.2), new THREE.MeshBasicMaterial({ color: asphalt }), lv.bays);
    for (let k = 0; k < lv.bays; k++) { m4.setPosition((k - (lv.bays - 1) / 2) * BAY_W, 0.016, rb - zc); slots.setMatrixAt(k, m4); }
    slots.userData = { ownGeo: true, ownMat: true };
    boardGroup.add(slab, rim, pad, cells, qs, slots);

    const half = Math.max(slabW, slabD) / 2 + 2;
    const sc = sun.shadow.camera; sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 1; sc.far = 50; sc.updateProjectionMatrix();
    sun.position.set(-half * 0.5, 14, half * 0.5); sun.target.position.set(0, 0, 0);

    buses = lv.buses.map((b, i) => {
      const g = makeBus(b.color, b.len, true);
      const cx = b.o === "H" ? b.c + (b.len - 1) / 2 : b.c, cr = b.o === "V" ? b.r + (b.len - 1) / 2 : b.r;
      const p = wp(cr, cx);
      const o = { g, b, base: p, yaw: busYaw(b), anim: null, shake: 0, bad: 0, intro: { t: -i * 0.04 } };
      g.rotation.y = o.yaw; busGroup.add(g);
      return o;
    });
    for (let k = 0; k < lv.bays; k++) {
      const g = new THREE.Group(); g.position.set((k - (lv.bays - 1) / 2) * BAY_W, 0, rb - zc);
      bayGroup.add(g); bays.push({ g, pop: 0, key: "" });
    }
  }

  /* ---------- Cola de pasajeros y bahías: se reconstruyen solo cuando cambia el estado ---------- */
  function syncDynamic() {
    const qk = st.qi + "/" + cur;
    if (qk !== qKey) {
      qKey = qk;
      while (queueGroup.children.length) queueGroup.remove(queueGroup.children[queueGroup.children.length - 1]);
      const sp = 0.74, maxN = Math.max(3, Math.floor((dims.slabW - 0.9) / sp));
      const x0 = -((dims.slabW - 0.9) / 2) + 0.4;
      for (let k = 0; k < maxN && st.qi + k < lv.queue.length; k++) {
        const col = lv.queue[st.qi + k], x = x0 + k * sp, z = dims.rq - zc, big = k === 0;
        const s = big ? 0.33 : 0.27;
        const body = part(geoSph, busMat[col], x, s * 0.85, z, true); body.scale.set(s, s * 0.85, s); queueGroup.add(body);
        const sy = part(geoPlane, symMat[col], x, s * 1.7 + 0.005, z, false); sy.scale.set(s * 1.1, 1, s * 1.1); queueGroup.add(sy);
        if (big) { const rg = part(geoRing, ringMat, x, 0.05, z, false); queueGroup.add(rg); }
      }
    }
    st.bays.forEach((b, k) => {
      const key = b ? b.color + ":" + b.n : "-";
      const bay = bays[k]; if (!bay || bay.key === key) return;
      const prev = bay.key; bay.key = key;
      while (bay.g.children.length) bay.g.remove(bay.g.children[bay.g.children.length - 1]);
      if (!b) return;
      const bg = makeBus(b.color, 2, false); bg.rotation.y = -Math.PI / 2; bay.g.add(bg);
      for (let s = 0; s < L.CAP; s++) {
        const h = part(geoSph, s < b.n ? seatOn : seatOff, 0, BUS_H + 0.1, 0, false);   // asientos en hilera sobre el techo
        h.scale.setScalar(0.09); h.position.set((s - 1) * 0.23, BUS_H + 0.08, 0.4); bay.g.add(h);
      }
      bay.pop = prev === "-" || prev === "" || prev.split(":")[0] !== String(b.color) ? 1 : 0.5;
    });
  }

  /* ---------- Cámara: inclinada, encuadra todo el tablero en cualquier pantalla ---------- */
  function resize() {
    if (!lv || !glOk) return;
    const wrap = $("boardWrap"), W = Math.max(200, wrap.clientWidth), H = Math.max(200, wrap.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    const el = ELEV * Math.PI / 180, hw = dims.slabW / 2 + 0.2, hh = dims.slabD / 2 + 0.2;
    const corners = [[-hw, 0, -hh], [hw, 0, -hh], [-hw, 0, hh], [hw, 0, hh], [-hw, 1.0, -hh], [hw, 1.0, -hh]];
    let lo = 2, hi = 250;
    for (let k = 0; k < 28; k++) {
      const D = (lo + hi) / 2;
      camera.position.set(0, D * Math.sin(el), D * Math.cos(el)); camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      const fits = corners.every((c) => { v1.set(c[0], c[1], c[2]).project(camera); return Math.abs(v1.x) <= 0.97 && Math.abs(v1.y) <= 0.97; });
      if (fits) hi = D; else lo = D;
    }
    camera.position.set(0, hi * Math.sin(el), hi * Math.cos(el)); camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    draw();
  }
  window.addEventListener("resize", () => { if (sGame.classList.contains("on")) resize(); });
  const v1 = new THREE.Vector3();

  // Para pruebas E2E: posición en pantalla (px de página del iframe) del centro de una celda / de un autobús
  function toScreen(x, y, z) {
    const rect = cv.getBoundingClientRect();
    v1.set(x, y, z).project(camera);
    return [rect.left + (v1.x + 1) / 2 * rect.width, rect.top + (1 - v1.y) / 2 * rect.height];
  }
  window.__busFeverCellToScreen = function (r, c) { const p = wp(r, c); return toScreen(p[0], Y_PICK, p[1]); };
  window.__busFeverBusToScreen = function (i) { const o = buses[i]; return toScreen(o.base[0], Y_PICK, o.base[1]); };

  function draw() {
    if (!glOk || !lv || !st) return;
    syncDynamic();
    buses.forEach((o, i) => {
      o.g.visible = st.alive[i];
      if (!o.g.visible) return;
      let ox = 0, oy = 0, oz = 0, sc = 1;
      const b = o.b, dx = b.o === "H" ? b.d : 0, dz = b.o === "V" ? b.d : 0;
      if (o.anim) {
        const t = o.anim.t, e = t * t * (3 - 2 * t), d = o.anim.dist * e;
        ox += dx * d; oz += dz * d;
        const f = Math.max(0, (t - 0.6) / 0.4); sc = 1 - 0.55 * f; oy += 0.5 * f;
      }
      if (o.shake > 0) { const k = Math.sin(o.shake * 40) * 0.1 * o.shake; ox += dx * k; oz += dz * k; }
      if (o.intro) { const p = Math.max(0, Math.min(1, o.intro.t / 0.5)); oy += Math.pow(1 - p, 3) * 3; }
      o.g.position.set(o.base[0] + ox, oy, o.base[1] + oz); o.g.scale.setScalar(sc);
      o.g.userData.gm.visible = i === hintMove && !o.anim && o.bad <= 0;
      o.g.userData.rm.visible = o.bad > 0;
    });
    bays.forEach((bay) => { const p = bay.pop > 0 ? 1 + Math.sin(Math.min(1, bay.pop) * Math.PI) * 0.12 : 1; bay.g.scale.setScalar(p); });
    renderer.render(scene, camera);
  }

  /* ---------- Animación (solo mientras algo se mueve) ---------- */
  function loop(now) {
    raf = 0;
    const dt = Math.min(0.25, (now - (loop.t || now)) / 1000); loop.t = now;
    let busy = false, done = -1;
    buses.forEach((o, i) => {
      if (o.intro) { o.intro.t += dt; if (o.intro.t >= 0.5) o.intro = null; else busy = true; }
      if (o.anim) {
        o.anim.t = Math.min(1, o.anim.t + dt / 0.42);
        if (o.anim.t >= 1) done = i; else busy = true;
      }
      if (o.shake > 0) { o.shake = Math.max(0, o.shake - dt * 3); busy = true; }
      if (o.bad > 0) { o.bad = Math.max(0, o.bad - dt * 2.2); busy = true; }
    });
    bays.forEach((bay) => { if (bay.pop > 0) { bay.pop = Math.max(0, bay.pop - dt * 4); busy = true; } });
    if (done >= 0) { const o = buses[done]; o.anim = null; commit(done); busy = true; }
    draw();
    if (busy) raf = requestAnimationFrame(loop);
    else checkEnd();
  }
  function kick() { if (!raf) { loop.t = 0; raf = requestAnimationFrame(loop); } }
  const animating = () => buses.some((o) => o.anim);

  function commit(i) {
    const n = L.tap(lv, st, i); if (!n) return;
    hist.push(st); st = n; hintMove = -1; updateHud();
    Arcade.haptic("light");
  }

  /* ---------- Entrada: se proyecta el toque sobre el plano del estacionamiento ---------- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
  cv.addEventListener("pointerdown", (ev) => {
    if (!glOk || !lv || over || animating() || overlay.classList.contains("on")) return;
    const rect = cv.getBoundingClientRect();
    ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(plane, hit)) return;
    const c = hit.x + (lv.w - 1) / 2, r = hit.z + zc;
    let best = -1, bd = 1e9;
    lv.buses.forEach((b, i) => {
      if (!st.alive[i]) return;
      const c0 = b.c - 0.5 - 0.15, c1 = b.c + (b.o === "H" ? b.len : 1) - 0.5 + 0.15;
      const r0 = b.r - 0.5 - 0.15, r1 = b.r + (b.o === "V" ? b.len : 1) - 0.5 + 0.15;
      if (c < c0 || c > c1 || r < r0 || r > r1) return;
      const d = Math.hypot(c - (c0 + c1) / 2, r - (r0 + r1) / 2);
      if (d < bd) { bd = d; best = i; }
    });
    if (best >= 0) tapBus(best);
  });

  function tapBus(i) {
    const o = buses[i];
    if (L.canTap(lv, st, i)) {
      $("msg").textContent = "";
      const b = lv.buses[i];
      const dist = b.o === "H" ? (b.d > 0 ? lv.w - b.c : b.c + b.len) : (b.d > 0 ? lv.h - b.r : b.r + b.len);
      o.anim = { t: 0, dist: dist + 0.2 };
      hintMove = hintMove === i ? -1 : hintMove;
    } else {
      $("msg").textContent = L.moves(lv, st).length === 0 && st.bays.indexOf(null) === -1 ? "Bahías llenas" : "Camino bloqueado";
      o.shake = 1; o.bad = 1;
      Arcade.haptic("error");
    }
    kick();
  }

  function checkEnd() {
    if (over) return;
    const s = L.status(lv, st);
    if (s === "play") return;
    over = true; updateHud(); setTimeout(() => finish(s === "win"), 250);
  }

  $("undoBtn").onclick = () => { if (over || animating() || !hist.length) return; st = hist.pop(); aids++; hintMove = -1; $("msg").textContent = ""; updateHud(); draw(); };
  $("restartBtn").onclick = () => startLevel(cur);
  $("bUndo").onclick = () => { overlay.classList.remove("on"); if (hist.length) { st = hist.pop(); aids++; } over = false; hintMove = -1; updateHud(); draw(); };
  $("hintBtn").onclick = async () => {
    if (over || animating() || hints <= 0 || hintMove !== -1) return;
    const sol = L.solve(lv, st);
    if (!sol || !sol.length) { $("msg").textContent = "Sin salida desde aquí: deshaz jugadas"; return; }
    const ok = await Ads.rewarded(); if (!ok) return;
    hints--; aids++; hintMove = sol[0]; updateHud(); draw();
  };

  /* ---------- Fin de nivel ---------- */
  function finish(won) {
    $("bUndo").style.display = won ? "none" : "";
    if (won) {
      const s = stars();
      if (!progress.stars[cur] || s > progress.stars[cur]) progress.stars[cur] = s;
      progress.completed = (progress.completed || 0) + 1; save();
      Arcade.submitScore("stars", totalStars());
      Arcade.haptic("success");
      $("ovTitle").textContent = "¡Nivel completo!";
      $("ovStars").textContent = "★".repeat(s) + "☆".repeat(3 - s);
      $("ovInfo").textContent = aids ? "Ayudas usadas: " + aids : "¡Sin ayudas!";
      $("bNext").style.display = cur < LEVELS.length - 1 ? "" : "none";
    } else {
      Arcade.haptic("error");
      $("ovTitle").textContent = "¡Bahías llenas!";
      $("ovStars").textContent = "☆☆☆";
      $("ovInfo").textContent = "Ningún pasajero puede subir. Deshaz o repite.";
      $("bNext").style.display = "none";
    }
    setTimeout(async () => {
      if (won && progress.completed % 3 === 0) await Ads.interstitial(); // anuncio cada 3 niveles
      overlay.classList.add("on");
    }, 200);
  }

  $("menuBtn").onclick = () => { buildMenu(); show("menu"); };
  $("bMenu").onclick = () => { overlay.classList.remove("on"); buildMenu(); show("menu"); };
  $("bRetry").onclick = () => startLevel(cur);
  $("bNext").onclick = () => startLevel(Math.min(cur + 1, LEVELS.length - 1));

  // Si cambia el tema del sistema con un nivel abierto, se vuelven a leer los colores
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onTheme = () => { if (glOk && lv && sGame.classList.contains("on") && !animating()) { buildScene(); resize(); } };
    if (mq.addEventListener) mq.addEventListener("change", onTheme);
  }

  window.__bf = { get st() { return st; }, get lv() { return lv; }, start: startLevel, get busy() { return !!raf; } };

  Arcade.ready().then(function (session) {
    const s = session.state;
    if (s && typeof s === "object" && s.stars && typeof s.stars === "object") progress = { stars: s.stars, completed: s.completed || 0 };
    buildMenu();
  });
})();
</script>
</body>
</html>
