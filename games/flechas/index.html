<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flechas · 10 niveles</title>
<style>
  :root {
    --bg:#fdfaf2; --ink:#2e473f; --panel:#ffffff; --line:#e6dfcf; --muted:#7d877f; --text:#26332d;
    --star:#f4a320; --star-off:#ddd6c4; --green:#3f8a52; --red:#d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14201c; --ink:#cfe3d8; --panel:#1f2e29; --line:#33463e; --muted:#8fa299; --text:#e8f1ec;
      --star-off:#3a4a43; --green:#5fcf85; --red:#ff7a72;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14201c; --ink:#cfe3d8; --panel:#1f2e29; --line:#33463e; --muted:#8fa299; --text:#e8f1ec;
    --star-off:#3a4a43; --green:#5fcf85; --red:#ff7a72;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; overscroll-behavior:none; touch-action:manipulation; }
  #app { max-width:520px; margin:0 auto; height:100%; display:flex; flex-direction:column; padding:10px 16px 14px; }
  .screen { display:none; flex:1; flex-direction:column; min-height:0; }
  .screen.on { display:flex; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer; }
  button:active { transform:scale(.96); }
  button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:bold; }
  button:disabled { opacity:.4; }

  /* menú */
  h1 { font-size:22px; margin:14px 0 6px; text-align:center; color:var(--ink); }
  .intro { text-align:center; color:var(--muted); margin:0 0 18px; line-height:1.4; font-size:14px; }
  #grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  #grid button { padding:14px 0; font-size:18px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  #grid button small { font-size:12px; color:var(--star); letter-spacing:1px; min-height:14px; }
  #grid button.locked { opacity:.35; }

  /* juego */
  .top { display:flex; align-items:center; justify-content:space-between; min-height:44px; }
  .top .side { width:64px; }
  .top .side:last-child { text-align:right; color:var(--muted); font-size:13px; }
  #menuBtn { padding:6px 10px; font-size:16px; }
  #stars { display:flex; gap:6px; font-size:28px; line-height:1; }
  #stars span { color:var(--star); transition:color .25s, transform .25s; }
  #stars span.off { color:var(--star-off); transform:scale(.85); }
  #boardWrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { touch-action:none; }
  #msg { text-align:center; color:var(--muted); font-size:13px; min-height:18px; margin-bottom:4px; }
  .bottom { display:flex; justify-content:center; padding-top:6px; }
  #hintBtn { position:relative; width:58px; height:58px; padding:0; border-radius:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  #hintBtn svg { width:30px; height:30px; }
  #hintCount { position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; border-radius:11px; background:#5cb82a; color:#fff; font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center; padding:0 5px; border:2px solid var(--bg); }

  /* ventana de fin de nivel */
  #overlay { position:fixed; inset:0; background:rgba(20,32,28,.55); display:none; align-items:center; justify-content:center; padding:24px; }
  #overlay.on { display:flex; }
  .card { background:var(--panel); border-radius:18px; padding:22px; width:100%; max-width:340px; text-align:center; border:1px solid var(--line); }
  .card h2 { margin:0 0 6px; color:var(--ink); }
  .big-stars { font-size:36px; color:var(--star); letter-spacing:4px; margin:8px 0; }
  .card .row { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="app">

  <section id="sMenu" class="screen on">
    <h1>Flechas</h1>
    <p class="intro">Toca una flecha para sacarla del tablero.<br>Si otra flecha le cierra el paso, perderás una estrella.</p>
    <div id="grid"></div>
  </section>

  <section id="sGame" class="screen">
    <div class="top">
      <div class="side"><button id="menuBtn" aria-label="Niveles">☰</button></div>
      <div id="stars"><span>★</span><span>★</span><span>★</span></div>
      <div class="side">Nivel <b id="lvNum">1</b></div>
    </div>
    <div id="boardWrap"><canvas id="cv"></canvas></div>
    <div id="msg"></div>
    <div class="bottom">
      <button id="hintBtn" aria-label="Pista">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3f8a52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" fill="#3f8a52" fill-opacity=".85"/>
        </svg>
        <span id="hintCount">3</span>
      </button>
    </div>
  </section>
</div>

<div id="overlay"><div class="card">
  <h2 id="ovTitle">¡Nivel completo!</h2>
  <div class="big-stars" id="ovStars"></div>
  <div id="ovInfo" style="color:var(--muted)"></div>
  <div class="row">
    <button id="bMenu">Niveles</button>
    <button id="bRetry">Repetir</button>
    <button id="bNext" class="primary">Siguiente</button>
  </div>
</div></div>

<script src="../_sdk/arcade-sdk.js" data-game="flechas"></script>
<script src="logic.js"></script>
<script src="levels.js"></script>
<script>
(function () {
  "use strict";
  const L = window.Logic, LEVELS = window.LEVELS_DATA;
  const LIVES = 3, HINTS = 3;

  /* Anuncios: los gestiona la app (frecuencia, consentimiento, AdMob). El juego solo los pide. */
  const Ads = {
    interstitial: function () { return Arcade.ads.interstitial(); },
    rewarded: function () { return Arcade.ads.rewarded(); }
  };

  /* ---------- Progreso guardado (lo persiste y sincroniza la app mediante el SDK) ---------- */
  let progress = { stars: {}, completed: 0 };
  const levelsDone = () => Object.keys(progress.stars).length;
  const totalStars = () => Object.keys(progress.stars).reduce(function (n, k) { return n + (progress.stars[k] || 0); }, 0);
  function save() { Arcade.save(progress, { progress: { value: levelsDone(), total: LEVELS.length } }); }

  const $ = (id) => document.getElementById(id);
  const sMenu = $("sMenu"), sGame = $("sGame"), cv = $("cv"), ctx = cv.getContext("2d"), overlay = $("overlay");

  /* ---------- Estado de la partida ---------- */
  let cur = 0, lv = null, arrows = [], lives = LIVES, hints = HINTS, hintIdx = -1, over = false, mistakes = 0;
  let cell = 40, margin = 20, cw = 0, ch = 0, dpr = 1, raf = 0;
  const COLOR = () => getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#2e473f";
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function buildMenu() {
    const g = $("grid"); g.innerHTML = "";
    LEVELS.forEach((l, i) => {
      const unlocked = i === 0 || progress.stars[i - 1] !== undefined;
      const st = progress.stars[i] || 0;
      const b = document.createElement("button");
      b.innerHTML = (i + 1) + "<small>" + (st ? "★".repeat(st) + "☆".repeat(3 - st) : "") + "</small>";
      if (!unlocked) { b.className = "locked"; b.disabled = true; }
      b.onclick = () => startLevel(i);
      g.appendChild(b);
    });
  }
  function show(screen) { sMenu.classList.toggle("on", screen === "menu"); sGame.classList.toggle("on", screen === "game"); }

  function startLevel(i) {
    cur = i; lv = LEVELS[i]; lives = LIVES; hints = HINTS; hintIdx = -1; over = false; mistakes = 0;
    arrows = lv.arrows.map((cells) => ({ cells, alive: true, anim: null, shake: 0, bad: 0 }));
    overlay.classList.remove("on"); $("msg").textContent = ""; $("lvNum").textContent = lv.id;
    show("game"); updateHud(); resize();
  }

  function updateHud() {
    [...$("stars").children].forEach((s, k) => s.classList.toggle("off", k >= lives));
    $("hintCount").textContent = hints;
    $("hintBtn").disabled = hints <= 0 || over;
  }

  /* ---------- Geometría ---------- */
  function resize() {
    if (!lv) return;
    const wrap = $("boardWrap");
    const availW = Math.max(200, wrap.clientWidth), availH = Math.max(200, wrap.clientHeight);
    cell = Math.floor(Math.min(availW / (lv.w + 1), availH / (lv.h + 1), 64));
    margin = cell;
    cw = lv.w * cell + margin * 2; ch = lv.h * cell + margin * 2;
    dpr = window.devicePixelRatio || 1;
    cv.width = cw * dpr; cv.height = ch * dpr; cv.style.width = cw + "px"; cv.style.height = ch + "px";
    draw();
  }
  window.addEventListener("resize", () => { if (sGame.classList.contains("on")) resize(); });

  const px = (r, c) => [margin + (c + 0.5) * cell, margin + (r + 0.5) * cell];

  // Polilínea de la serpiente + prolongación recta más allá del tablero (por donde sale).
  function polyline(a) {
    const pts = a.cells.map(([r, c]) => px(r, c));
    const [dr, dc] = L.headDir(a.cells), h = pts[pts.length - 1];
    const far = (cw + ch) * 2;
    pts.push([h[0] + dc * far, h[1] + dr * far]);
    return pts;
  }
  function cumulative(pts) {
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return cum;
  }
  function pointAt(pts, cum, d) {
    d = Math.max(0, Math.min(cum[cum.length - 1], d));
    let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
    const t = (d - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
    return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
  }
  // Tramo [a,b] (longitud de arco) de la polilínea
  function slice(pts, cum, a, b) {
    const out = [pointAt(pts, cum, a)];
    for (let i = 0; i < pts.length; i++) if (cum[i] > a && cum[i] < b) out.push(pts[i]);
    out.push(pointAt(pts, cum, b));
    return out;
  }

  function drawArrow(a, color) {
    const pts = a.geo ? a.geo.pts : (a.geo = prep(a)).pts, cum = a.geo.cum, len = a.geo.len;
    const s = a.anim ? a.anim.s : 0;
    let off = [0, 0];
    if (a.shake > 0) { const [dr, dc] = L.headDir(a.cells); const k = Math.sin(a.shake * 40) * cell * 0.12 * a.shake; off = [dc * k, dr * k]; }
    const sl = slice(pts, cum, s, s + len);
    ctx.save(); ctx.translate(off[0], off[1]);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = cell * 0.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); sl.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    // punta
    const e = sl[sl.length - 1], p0 = sl[sl.length - 2] || sl[0];
    let dx = e[0] - p0[0], dy = e[1] - p0[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const t = cell * 0.34, w = cell * 0.26;
    ctx.beginPath();
    ctx.moveTo(e[0] + dx * t, e[1] + dy * t);
    ctx.lineTo(e[0] - dy * w, e[1] + dx * w);
    ctx.lineTo(e[0] + dy * w, e[1] - dx * w);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function prep(a) {
    const pts = polyline(a), cum = cumulative(pts);
    // longitud del cuerpo = longitud de las celdas originales
    let len = 0; for (let i = 1; i < a.cells.length; i++) len += cell;
    return { pts, cum, len };
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cw, ch);
    const ink = cssVar("--ink") || "#2e473f", green = cssVar("--green") || "#3f8a52", red = cssVar("--red") || "#d9534f";
    arrows.forEach((a, i) => {
      if (!a.alive && !a.anim) return;
      a.geo = prep(a);
      drawArrow(a, a.bad > 0 ? red : (i === hintIdx ? green : ink));
    });
  }

  /* ---------- Animación ---------- */
  function loop(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - (loop.t || now)) / 1000); loop.t = now;
    let busy = false;
    arrows.forEach((a) => {
      if (a.anim) {
        a.anim.s += cell * 16 * dt * (0.4 + a.anim.s / (cell * 6));
        const geo = a.geo || prep(a);
        const [dr, dc] = L.headDir(a.cells), h = px(a.cells[a.cells.length - 1][0], a.cells[a.cells.length - 1][1]);
        const dEdge = dr > 0 ? ch - h[1] : dr < 0 ? h[1] : dc > 0 ? cw - h[0] : h[0];
        if (a.anim.s >= geo.len + dEdge + geo.len + 4) { a.anim = null; }
        else busy = true;
      }
      if (a.shake > 0) { a.shake = Math.max(0, a.shake - dt * 3); busy = true; }
      if (a.bad > 0) { a.bad = Math.max(0, a.bad - dt * 2.2); busy = true; }
    });
    draw();
    if (busy) raf = requestAnimationFrame(loop);
    else checkEnd();
  }
  function kick() { if (!raf) { loop.t = 0; raf = requestAnimationFrame(loop); } }

  /* ---------- Entrada ---------- */
  function distSeg(x, y, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / l2));
    return Math.hypot(x - (a[0] + dx * t), y - (a[1] + dy * t));
  }
  cv.addEventListener("pointerdown", (ev) => {
    if (over || overlay.classList.contains("on")) return;
    const rect = cv.getBoundingClientRect();
    const x = (ev.clientX - rect.left) * (cw / rect.width), y = (ev.clientY - rect.top) * (ch / rect.height);
    let best = -1, bd = cell * 0.5;
    arrows.forEach((a, i) => {
      if (!a.alive) return;
      const pts = a.cells.map(([r, c]) => px(r, c));
      // la zona tocable incluye la punta
      for (let k = 1; k < pts.length; k++) { const d = distSeg(x, y, pts[k - 1], pts[k]); if (d < bd) { bd = d; best = i; } }
    });
    if (best >= 0) tapArrow(best);
  });

  function tapArrow(i) {
    const a = arrows[i];
    const alive = arrows.map((o) => o.alive);
    const occ = L.occupancy(lv, alive);
    const blk = L.blocker(lv, i, occ);
    if (blk === -1) {
      a.alive = false; a.anim = { s: 0 };
      if (hintIdx === i) hintIdx = -1;
      $("msg").textContent = "";
    } else {
      a.shake = 1; a.bad = 1; arrows[blk].bad = 0.6;
      lives--; mistakes++; updateHud();
      Arcade.haptic("error");
      if (lives <= 0) { over = true; updateHud(); setTimeout(() => finish(false), 600); }
    }
    kick();
  }

  function checkEnd() {
    if (!over && arrows.every((a) => !a.alive && !a.anim)) { over = true; updateHud(); setTimeout(() => finish(true), 250); }
  }

  /* ---------- Pista ---------- */
  $("hintBtn").onclick = async () => {
    if (over || hints <= 0) return;
    const free = L.freeArrows(lv, arrows.map((a) => a.alive));
    if (!free.length) return;
    if (hintIdx === -1) { // una pista nueva solo si no hay una a la vista
      const ok = await Ads.rewarded(); if (!ok) return;
      hints--; hintIdx = free[0];
      updateHud(); draw();
    }
  };

  /* ---------- Fin de nivel ---------- */
  function finish(won) {
    if (won) {
      const st = Math.max(1, lives);
      if (!progress.stars[cur] || st > progress.stars[cur]) progress.stars[cur] = st;
      progress.completed = (progress.completed || 0) + 1; save();
      Arcade.submitScore("stars", totalStars());
      Arcade.haptic("success");
      $("ovTitle").textContent = "¡Nivel completo!";
      $("ovStars").textContent = "★".repeat(st) + "☆".repeat(3 - st);
      $("ovInfo").textContent = mistakes ? "Errores: " + mistakes : "¡Sin errores!";
      $("bNext").style.display = cur < LEVELS.length - 1 ? "" : "none";
    } else {
      $("ovTitle").textContent = "Te quedaste sin estrellas";
      $("ovStars").textContent = "☆☆☆";
      $("ovInfo").textContent = "Inténtalo de nuevo";
      $("bNext").style.display = "none";
    }
    setTimeout(async () => {
      if (won && progress.completed % 3 === 0) await Ads.interstitial(); // anuncio cada 3 niveles
      overlay.classList.add("on");
    }, 200);
  }

  $("menuBtn").onclick = () => { buildMenu(); show("menu"); };
  $("bMenu").onclick = () => { overlay.classList.remove("on"); buildMenu(); show("menu"); };
  $("bRetry").onclick = () => startLevel(cur);
  $("bNext").onclick = () => startLevel(Math.min(cur + 1, LEVELS.length - 1));

  Arcade.ready().then(function (session) {
    const s = session.state;
    if (s && typeof s === "object" && s.stars && typeof s.stars === "object") progress = { stars: s.stars, completed: s.completed || 0 };
    buildMenu();
  });
})();
</script>
</body>
</html>
