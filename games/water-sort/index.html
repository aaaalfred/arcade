<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Trasvase · 10 niveles</title>
<style>
  :root {
    --bg:#fdfaf2; --ink:#2e473f; --panel:#ffffff; --line:#e6dfcf; --muted:#7d877f; --text:#26332d;
    --star:#f4a320; --star-off:#ddd6c4; --green:#3f8a52; --red:#d9534f; --glass:#f1ece0; --glass-line:#b9b09a;
    --c0:#e63946; --c1:#2a6fdb; --c2:#2fa84f; --c3:#f4c20d; --c4:#8e44ad; --c5:#ff8c1a; --c6:#18b6c9; --c7:#e668a8; --c8:#7a4a2b; --c9:#8a9aa8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14201c; --ink:#cfe3d8; --panel:#1f2e29; --line:#33463e; --muted:#8fa299; --text:#e8f1ec;
      --star-off:#3a4a43; --green:#5fcf85; --red:#ff7a72; --glass:#27382f; --glass-line:#5d7568;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14201c; --ink:#cfe3d8; --panel:#1f2e29; --line:#33463e; --muted:#8fa299; --text:#e8f1ec;
    --star-off:#3a4a43; --green:#5fcf85; --red:#ff7a72; --glass:#27382f; --glass-line:#5d7568;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; overscroll-behavior:none; touch-action:manipulation; }
  #app { max-width:520px; margin:0 auto; height:100%; display:flex; flex-direction:column; padding:10px 16px 14px; }
  .screen { display:none; flex:1; flex-direction:column; min-height:0; }
  .screen.on { display:flex; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer; min-height:44px; }
  button:active { transform:scale(.96); }
  button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:bold; }
  button:disabled { opacity:.4; }

  /* menú */
  h1 { font-size:22px; margin:14px 0 6px; text-align:center; color:var(--ink); }
  .intro { text-align:center; color:var(--muted); margin:0 0 18px; line-height:1.4; font-size:14px; }
  #grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  #grid button { padding:14px 0; font-size:18px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  #grid button small { font-size:12px; color:var(--star); letter-spacing:1px; min-height:14px; }
  #grid button.locked { opacity:.35; }
  .opt { margin:22px auto 0; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; min-height:44px; }
  .opt input { width:22px; height:22px; }

  /* juego */
  .top { display:flex; align-items:center; justify-content:space-between; min-height:44px; }
  .top .side { width:84px; }
  .top .side:last-child { text-align:right; color:var(--muted); font-size:13px; }
  #menuBtn { padding:6px 10px; font-size:16px; min-width:44px; }
  #stars { display:flex; gap:6px; font-size:28px; line-height:1; }
  #stars span { color:var(--star); transition:color .25s, transform .25s; }
  #stars span.off { color:var(--star-off); transform:scale(.85); }
  #info { text-align:center; color:var(--muted); font-size:13px; min-height:18px; }

  #boardWrap { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #noGL { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--muted); }

  #msg { text-align:center; color:var(--muted); font-size:13px; min-height:18px; margin-bottom:4px; }
  .bottom { display:flex; justify-content:center; gap:12px; padding-top:6px; }
  .bottom button { min-width:84px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:13px; }
  .bottom button b { font-size:20px; line-height:1; }

  #overlay { position:fixed; inset:0; background:rgba(20,32,28,.55); display:none; align-items:center; justify-content:center; padding:24px; }
  #overlay.on { display:flex; }
  .card { background:var(--panel); border-radius:18px; padding:22px; width:100%; max-width:340px; text-align:center; border:1px solid var(--line); }
  .card h2 { margin:0 0 6px; color:var(--ink); }
  .big-stars { font-size:36px; color:var(--star); letter-spacing:4px; margin:8px 0; }
  .card .row { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="app">

  <section id="sMenu" class="screen on">
    <h1>Trasvase</h1>
    <p class="intro">Toca un tubo y luego otro para verter.<br>Deja cada tubo de un solo color, o vacío.</p>
    <div id="grid"></div>
    <label class="opt"><input type="checkbox" id="symChk"> Mostrar símbolos (daltonismo)</label>
  </section>

  <section id="sGame" class="screen">
    <div class="top">
      <div class="side"><button id="menuBtn" aria-label="Niveles">☰</button></div>
      <div id="stars"><span>★</span><span>★</span><span>★</span></div>
      <div class="side">Nivel <b id="lvNum">1</b></div>
    </div>
    <div id="info"></div>
    <div id="boardWrap"><canvas id="cv"></canvas><div id="noGL">No se pudo iniciar el modo 3D en este dispositivo.</div></div>
    <div id="msg"></div>
    <div class="bottom">
      <button id="undoBtn"><b>↶</b>Deshacer</button>
      <button id="resetBtn"><b>⟳</b>Reiniciar</button>
      <button id="addBtn"><b>+</b>Añadir tubo</button>
    </div>
  </section>
</div>

<div id="overlay"><div class="card">
  <h2>¡Nivel completo!</h2>
  <div class="big-stars" id="ovStars"></div>
  <div id="ovInfo" style="color:var(--muted)"></div>
  <div class="row">
    <button id="bMenu">Niveles</button>
    <button id="bRetry">Repetir</button>
    <button id="bNext" class="primary">Siguiente</button>
  </div>
</div></div>

<script src="../_sdk/arcade-sdk.js" data-game="water-sort"></script>
<script src="../_sdk/three.min.js"></script>
<script src="logic.js"></script>
<script src="levels.js"></script>
<script>
(function () {
  "use strict";
  const L = window.Logic, LEVELS = window.LEVELS_DATA;

  /* Anuncios: los gestiona la app (frecuencia, consentimiento, AdMob). El juego solo los pide. */
  const Ads = {
    interstitial: function () { return Arcade.ads.interstitial(); },
    rewarded: function () { return Arcade.ads.rewarded(); }
  };

  /* ---------- Progreso guardado (lo persiste y sincroniza la app mediante el SDK) ---------- */
  let progress = { stars: {}, completed: 0, sym: false };
  const levelsDone = () => Object.keys(progress.stars).length;
  const totalStars = () => Object.keys(progress.stars).reduce(function (n, k) { return n + (progress.stars[k] || 0); }, 0);
  function save() { Arcade.save(progress, { progress: { value: levelsDone(), total: LEVELS.length } }); }

  const $ = (id) => document.getElementById(id);
  const sMenu = $("sMenu"), sGame = $("sGame"), cv = $("cv"), overlay = $("overlay");
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  /* ---------- Estado de la partida ---------- */
  let cur = 0, lv = null, tubes = [], history = [], sel = -1, busy = false, over = false, added = false, raf = 0;

  function applySym() { $("symChk").checked = !!progress.sym; draw(); }

  function buildMenu() {
    const g = $("grid"); g.innerHTML = "";
    LEVELS.forEach((l, i) => {
      const unlocked = i === 0 || progress.stars[i - 1] !== undefined;
      const st = progress.stars[i] || 0;
      const b = document.createElement("button");
      b.innerHTML = (i + 1) + "<small>" + (st ? "★".repeat(st) + "☆".repeat(3 - st) : "") + "</small>";
      if (!unlocked) { b.className = "locked"; b.disabled = true; }
      b.onclick = () => startLevel(i);
      g.appendChild(b);
    });
  }
  function show(s) { sMenu.classList.toggle("on", s === "menu"); sGame.classList.toggle("on", s === "game"); }

  function startLevel(i) {
    cur = i; lv = LEVELS[i];
    tubes = lv.tubes.map((t) => t.slice()); history = []; sel = -1; busy = false; over = false; added = false; anim = null;
    overlay.classList.remove("on"); $("msg").textContent = ""; $("lvNum").textContent = lv.id;
    show("game"); updateHud();
    if (!initGL()) return;
    buildScene(true);
    resize();
    kick();
  }

  function liveStars() { return L.starsFor(history.length, lv.ref); }
  function updateHud() {
    const st = history.length === 0 ? 3 : liveStars();
    [...$("stars").children].forEach((s, k) => s.classList.toggle("off", k >= st));
    $("info").textContent = "Movimientos: " + history.length + " · objetivo ★★★: " + (Math.ceil(lv.ref * 1.3) + 1);
    $("undoBtn").disabled = !history.length || busy || over;
    $("addBtn").disabled = added || busy || over;
    $("resetBtn").disabled = busy;
  }

  /* =====================================================================
   * Presentación 3D (three.js, vendorizado en ../_sdk/three.min.js)
   * Unidades del mundo: tubo de radio ~0.42 y alto ~3.7. x = columna, z = fila, y = altura.
   * ===================================================================== */
  const CAPN = L.CAP, LH = 0.78, BASE = 0.44, R_GL = 0.42, R_LQ = 0.335, GH = BASE + CAPN * LH + 0.16;
  const DX = 1.18, DZ = 2.5, ELEV = 60, LIFT = 0.65, TOPY = 5.3;
  let renderer = null, scene, camera, hemi, sun, boardGroup, tubesGroup, glOk = null, T = {};
  let geo = {}, mats = {}, slots = [], anim = null;

  function initGL() {
    if (glOk !== null) return glOk;
    try {
      if (!window.THREE) throw new Error("three.js no cargó");
      renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setClearColor(0x000000, 0);
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(30, 1, 0.5, 300);
      hemi = new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.9); scene.add(hemi);
      sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(-4, 12, 7); scene.add(sun);
      boardGroup = new THREE.Group(); tubesGroup = new THREE.Group(); scene.add(boardGroup, tubesGroup);
      makeShared();
      stream = new THREE.Mesh(geo.stream, mats.liq[0]); stream.visible = false; scene.add(stream);
      cv.addEventListener("webglcontextlost", (e) => e.preventDefault());
      cv.addEventListener("webglcontextrestored", () => draw());
      glOk = true;
    } catch (err) {
      glOk = false; $("noGL").style.display = "flex"; cv.style.display = "none";
      if (window.console) console.warn("[water-sort] WebGL no disponible:", err);
    }
    return glOk;
  }

  /* Símbolos para daltonismo: se dibujan con trazos (sin depender de fuentes) en un atlas de 5x2 */
  function symbolAtlas() {
    const S = 96, c = document.createElement("canvas"); c.width = S * 5; c.height = S * 2;
    const x = c.getContext("2d");
    x.lineJoin = "round"; x.lineCap = "round";
    const shapes = [
      (r) => { x.arc(0, 0, r, 0, 7); },
      (r) => { x.moveTo(0, -r); x.lineTo(r, r * 0.8); x.lineTo(-r, r * 0.8); x.closePath(); },
      (r) => { x.rect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7); },
      (r) => { for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, q = k % 2 ? r * 0.45 : r; x[k ? "lineTo" : "moveTo"](Math.cos(a) * q, Math.sin(a) * q); } x.closePath(); },
      (r) => { x.moveTo(0, -r); x.lineTo(r * 0.8, 0); x.lineTo(0, r); x.lineTo(-r * 0.8, 0); x.closePath(); },
      (r) => { const t = r * 0.32; x.moveTo(-t, -r); x.lineTo(t, -r); x.lineTo(t, -t); x.lineTo(r, -t); x.lineTo(r, t); x.lineTo(t, t); x.lineTo(t, r); x.lineTo(-t, r); x.lineTo(-t, t); x.lineTo(-r, t); x.lineTo(-r, -t); x.lineTo(-t, -t); x.closePath(); },
      (r) => { for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; x[k ? "lineTo" : "moveTo"](Math.cos(a) * r, Math.sin(a) * r); } x.closePath(); },
      (r) => { x.arc(0, 0, r, 0, 7); x.moveTo(r * 0.45, 0); x.arc(0, 0, r * 0.45, 0, 7, true); },
      (r) => { x.moveTo(0, r * 0.85); x.bezierCurveTo(-r * 1.5, -r * 0.1, -r * 0.6, -r * 1.1, 0, -r * 0.35); x.bezierCurveTo(r * 0.6, -r * 1.1, r * 1.5, -r * 0.1, 0, r * 0.85); },
      (r) => { x.rect(-r * 0.85, -r * 0.8, r * 0.55, r * 1.6); x.rect(r * 0.3, -r * 0.8, r * 0.55, r * 1.6); }
    ];
    shapes.forEach((fn, k) => {
      x.save(); x.translate((k % 5) * S + S / 2, Math.floor(k / 5) * S + S / 2);
      x.beginPath(); fn(S * 0.3);
      x.lineWidth = 9; x.strokeStyle = "rgba(0,0,0,.75)"; x.stroke();
      x.fillStyle = "#fff"; x.fill("evenodd"); x.restore();
    });
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
    return tex;
  }
  function blobTexture() {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 2, 32, 32, 32);
    g.addColorStop(0, "rgba(0,0,0,.9)"); g.addColorStop(0.55, "rgba(0,0,0,.35)"); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }

  // Geometrías y materiales compartidos por todos los tubos (se crean una sola vez)
  function makeShared() {
    const pts = [];
    for (let k = 0; k <= 8; k++) { const a = k / 8 * Math.PI / 2; pts.push(new THREE.Vector2(R_GL * Math.sin(a), R_GL - R_GL * Math.cos(a))); }
    pts.push(new THREE.Vector2(R_GL, GH));
    geo.glass = new THREE.LatheGeometry(pts, 28);
    geo.rim = new THREE.TorusGeometry(R_GL, 0.045, 8, 28); geo.rim.rotateX(Math.PI / 2); geo.rim.translate(0, GH, 0);
    geo.cap = new THREE.SphereGeometry(1, 20, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
    geo.layer = new THREE.CylinderGeometry(R_LQ, R_LQ, 1, 22);
    geo.stream = new THREE.CylinderGeometry(1, 1, 1, 8);
    geo.blob = new THREE.PlaneGeometry(1, 1); geo.blob.rotateX(-Math.PI / 2);
    geo.hl = new THREE.PlaneGeometry(0.07, GH - 1.1);
    geo.sym = [];
    for (let k = 0; k < 10; k++) {
      const g = new THREE.PlaneGeometry(0.36, 0.36), uv = g.attributes.uv, cx = k % 5, cy = Math.floor(k / 5);
      for (let j = 0; j < uv.count; j++) uv.setXY(j, (cx + uv.getX(j)) / 5, 1 - (cy + 1 - uv.getY(j)) / 2);
      geo.sym.push(g);
    }
    mats.symTex = symbolAtlas();
    mats.sym = new THREE.MeshBasicMaterial({ map: mats.symTex, transparent: true, depthWrite: false });
    mats.blobTex = blobTexture();
    mats.blob = new THREE.MeshBasicMaterial({ map: mats.blobTex, color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false });
    mats.glass = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.12, metalness: 0, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false });
    mats.hl = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, depthWrite: false });
    mats.rim = new THREE.MeshStandardMaterial({ roughness: 0.4 });
    mats.rimSel = new THREE.MeshStandardMaterial({ roughness: 0.4 });
    mats.rimDone = new THREE.MeshStandardMaterial({ roughness: 0.4 });
    mats.liq = [];
    for (let k = 0; k < 10; k++) mats.liq.push(new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0 }));
    mats.slab = new THREE.MeshStandardMaterial({ roughness: 0.85 });
    mats.slabRim = new THREE.MeshStandardMaterial({ roughness: 0.9 });
  }

  function readTheme() {
    T = { panel: cssVar("--panel") || "#fff", line: cssVar("--line") || "#e6dfcf", glass: cssVar("--glass") || "#f1ece0",
          glassLine: cssVar("--glass-line") || "#b9b09a", green: cssVar("--green") || "#3f8a52", ink: cssVar("--ink") || "#2e473f" };
    T.dark = new THREE.Color(cssVar("--bg") || "#fff").getHSL({}).l < 0.5;
    mats.slab.color.set(T.panel); mats.slabRim.color.set(T.line);
    mats.glass.color.set(T.dark ? "#cfe3d8" : "#ffffff"); mats.glass.opacity = T.dark ? 0.2 : 0.24;
    mats.hl.opacity = T.dark ? 0.32 : 0.55;
    mats.rim.color.set(T.glassLine); mats.rimSel.color.set(T.green); mats.rimDone.color.set(T.green);
    mats.blob.opacity = T.dark ? 0.5 : 0.24;
    hemi.intensity = T.dark ? 0.8 : 0.9; sun.intensity = T.dark ? 0.7 : 0.85;
    for (let k = 0; k < 10; k++) mats.liq[k].color.set(cssVar("--c" + k) || "#888");
  }

  function disposeSlots() {
    while (tubesGroup.children.length) tubesGroup.remove(tubesGroup.children[tubesGroup.children.length - 1]);
    while (boardGroup.children.length) {
      const o = boardGroup.children.pop();
      if (o.userData.ownGeo && o.geometry) o.geometry.dispose();
    }
    slots = [];
  }

  // Posiciones de los tubos: hasta 4 en una fila; más tubos en dos filas
  function layout(n) {
    const cols = n <= 4 ? n : Math.ceil(n / 2), rows = Math.ceil(n / cols), pos = [];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols), inRow = Math.min(cols, n - r * cols), c = i - r * cols;
      pos.push([(c - (inRow - 1) / 2) * DX, (r - (rows - 1) / 2) * DZ]);
    }
    return { cols, rows, pos };
  }

  function makeSlot(i, p) {
    const g = new THREE.Group(), s = { g, x: p[0], z: p[1], dx: 0, dy: 0, dz: 0, rz: 0, lift: 0, wob: 0, done: false, intro: -i * 0.05, layers: [], syms: [] };
    const glass = new THREE.Mesh(geo.glass, mats.glass); glass.renderOrder = 2;
    s.rim = new THREE.Mesh(geo.rim, mats.rim); s.rim.renderOrder = 3;
    const hl = new THREE.Mesh(geo.hl, mats.hl); hl.position.set(-0.2, 0.75 + (GH - 1.1) / 2, 0.375); hl.renderOrder = 4;
    s.cap = new THREE.Mesh(geo.cap, mats.liq[0]); s.cap.position.y = BASE; s.cap.scale.setScalar(R_LQ);
    g.add(s.cap);
    for (let k = 0; k < CAPN; k++) {
      const m = new THREE.Mesh(geo.layer, mats.liq[0]); g.add(m); s.layers.push(m);
      const y = new THREE.Mesh(geo.sym[0], mats.sym); y.position.z = R_LQ + 0.012; y.renderOrder = 5; g.add(y); s.syms.push(y);
    }
    g.add(glass, s.rim, hl);
    const blob = new THREE.Mesh(geo.blob, mats.blob); blob.scale.set(1.5, 1, 1.5); blob.position.set(p[0], 0.012, p[1]);
    boardGroup.add(blob); s.blob = blob;
    tubesGroup.add(g);
    return s;
  }

  // Coloca las capas de un tubo: cols = colores de abajo hacia arriba, hs = altura relativa (0..1) de cada una
  function setLayers(s, cols, hs) {
    let y = BASE;
    for (let k = 0; k < CAPN; k++) {
      const m = s.layers[k], sy = s.syms[k], h = k < cols.length ? hs[k] : 0;
      if (h <= 0.002) { m.visible = false; sy.visible = false; continue; }
      m.visible = true; m.material = mats.liq[cols[k]];
      m.scale.y = LH * h; m.position.y = y + LH * h / 2;
      sy.visible = !!progress.sym && h > 0.7;
      if (sy.visible) { sy.geometry = geo.sym[cols[k]]; sy.position.y = y + LH * h / 2; }
      y += LH * h;
    }
    const h0 = cols.length ? hs[0] : 0;
    s.cap.visible = h0 > 0.02;
    if (s.cap.visible) { s.cap.material = mats.liq[cols[0]]; s.cap.scale.y = R_LQ * Math.min(1, h0 * 2.5); }
  }
  const ones = [1, 1, 1, 1];
  function syncSlot(i) {
    const s = slots[i], t = tubes[i];
    setLayers(s, t, ones);
    s.done = t.length > 0 && L.tubeDone(t);
  }
  function syncAll() { slots.forEach((_, i) => syncSlot(i)); }

  // Tablero (losa + borde) y tubos del nivel actual
  function buildScene(intro) {
    readTheme();
    disposeSlots();
    const ly = layout(tubes.length);
    ly.pos.forEach((p, i) => slots.push(makeSlot(i, p)));
    syncAll();
    const hw = Math.max(1, (ly.cols - 1) / 2) * DX + 0.95 + (ly.cols === 1 ? 0.3 : 0), hd = (ly.rows - 1) / 2 * DZ + 1.35;
    const slab = new THREE.Mesh(new THREE.BoxGeometry(hw * 2, 0.5, hd * 2), mats.slab);
    slab.position.y = -0.25; slab.userData.ownGeo = true;
    const rim = new THREE.Mesh(new THREE.BoxGeometry(hw * 2 + 0.3, 0.3, hd * 2 + 0.3), mats.slabRim);
    rim.position.y = -0.62; rim.userData.ownGeo = true;
    boardGroup.add(slab, rim);
    bounds = { hw: hw, hd: hd };
    if (!intro) slots.forEach((s) => { s.intro = 1; });
  }
  let bounds = { hw: 3, hd: 3 };

  /* ---------- Cámara: inclinada, encuadra el tablero completo en cualquier pantalla ---------- */
  const v1 = new THREE.Vector3(), v2 = new THREE.Vector3();
  let pxPerUnit = 40;
  function resize() {
    if (!lv || !glOk) return;
    const wrap = $("boardWrap"), W = Math.max(200, wrap.clientWidth), H = Math.max(200, wrap.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    const el = ELEV * Math.PI / 180, hw = bounds.hw, hd = bounds.hd, front = Math.max(0, hd - 1.35);
    const corners = [[-hw, 0, -hd], [hw, 0, -hd], [-hw, 0, hd], [hw, 0, hd],
                     [-hw + 0.4, TOPY, -hd + 0.5], [hw - 0.4, TOPY, -hd + 0.5], [-hw + 0.4, GH + LIFT, front], [hw - 0.4, GH + LIFT, front]];
    const aim = [0, 1.5, 0];
    let lo = 2, hi = 250;
    for (let k = 0; k < 28; k++) {
      const D = (lo + hi) / 2;
      camera.position.set(0, aim[1] + D * Math.sin(el), D * Math.cos(el)); camera.lookAt(aim[0], aim[1], aim[2]);
      camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      const fits = corners.every((c) => { v1.set(c[0], c[1], c[2]).project(camera); return Math.abs(v1.x) <= 0.96 && Math.abs(v1.y) <= 0.96; });
      if (fits) hi = D; else lo = D;
    }
    camera.position.set(0, aim[1] + hi * Math.sin(el), hi * Math.cos(el)); camera.lookAt(aim[0], aim[1], aim[2]);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    const a = proj(0, 1, 0), b = proj(1, 1, 0); pxPerUnit = Math.abs(b[0] - a[0]);
    draw();
  }
  window.addEventListener("resize", () => { if (sGame.classList.contains("on")) resize(); });
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onTheme = () => { if (glOk && lv) { readTheme(); draw(); } };
    if (mq.addEventListener) mq.addEventListener("change", onTheme); else if (mq.addListener) mq.addListener(onTheme);
  }

  // Posición en pantalla (px del documento) de un punto del mundo
  function proj(x, y, z) {
    const rect = cv.getBoundingClientRect();
    v2.set(x, y, z).project(camera);
    return [rect.left + (v2.x + 1) / 2 * rect.width, rect.top + (1 - v2.y) / 2 * rect.height];
  }

  /* ---------- Dibujo ---------- */
  const ease = (t) => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
  function draw() {
    if (!glOk || !lv || !slots.length) return;
    slots.forEach((s, i) => {
      const ip = 1 - ease(s.intro < 0 ? 0 : s.intro / 0.45);
      const hop = s.hop ? Math.sin(Math.min(1, s.hop) * Math.PI) * 0.35 : 0;
      s.g.position.set(s.x + s.dx, s.lift + s.dy + ip * 4 + hop, s.z + s.dz);
      s.g.rotation.z = s.rz + Math.sin(s.wob * 30) * 0.12 * s.wob;
      s.g.visible = ip < 1;
      s.rim.material = i === sel ? mats.rimSel : (s.done ? mats.rimDone : mats.rim);
      s.blob.visible = ip < 0.6;
      const k = 1 + Math.min(1, s.lift / LIFT) * 0.18;
      s.blob.scale.set(1.5 * k, 1, 1.5 * k);
    });
    renderer.render(scene, camera);
  }

  /* ---------- Animación ---------- */
  const T1 = 0.42, T3 = 0.4, TH0 = 44 * Math.PI / 180, TH1 = 64 * Math.PI / 180;
  const lip = new THREE.Vector3(), lipLocal = new THREE.Vector3(), AXZ = new THREE.Vector3(0, 0, 1);
  let stream = null;
  function pivotFor(a, th) {
    // posición del tubo origen para que su borde quede en lip (rotación -dir*th alrededor de z)
    lipLocal.set(a.dir * R_GL, GH, 0).applyAxisAngle(AXZ, -a.dir * th);
    return [lip.x - lipLocal.x, lip.y - lipLocal.y];
  }

  function doPour(ia, ib) {
    const before = tubes, n = L.pourAmount(before, ia, ib), color = before[ia][before[ia].length - 1];
    const sa = slots[ia], sb = slots[ib];
    // el cuerpo del tubo se inclina hacia el centro del tablero para no salirse de la pantalla
    let dir = sb.x < -0.01 ? -1 : (sb.x > 0.01 ? 1 : (sa.x > 0 ? -1 : 1));
    history.push(tubes);
    tubes = L.pour(tubes, ia, ib); sel = -1; busy = true;
    lip.set(sb.x - dir * 0.08, GH + 1.45, sb.z);
    anim = { ia, ib, n, color, dir, oldA: before[ia], oldB: before[ib], t: 0, T2: 0.32 + 0.2 * n,
             sx: sa.dx, sy: sa.lift, from: null };
    updateHud(); kick();
  }

  function stepAnim(dt) {
    const a = anim, sa = slots[a.ia], sb = slots[a.ib];
    a.t += dt;
    const T2 = a.T2, tEnd = T1 + T2 + T3;
    let hsA = ones, hsB = ones, colsB = a.oldB, th, px, py;
    if (a.t < T1) {
      const u = ease(a.t / T1), p1 = pivotFor(a, TH0);
      th = TH0 * u;
      px = (sa.x + a.sx) * (1 - u) + p1[0] * u; py = a.sy * (1 - u) + p1[1] * u;
      hsA = ones; hsB = ones;
      stream.visible = false;
    } else if (a.t < T1 + T2) {
      const p = (a.t - T1) / T2;
      th = TH0 + (TH1 - TH0) * p;
      const pv = pivotFor(a, th); px = pv[0]; py = pv[1];
      hsA = []; for (let k = 0; k < CAPN; k++) { const run = k - (a.oldA.length - a.n); hsA.push(run < 0 ? 1 : Math.max(0, Math.min(1, a.n * (1 - p) - run))); }
      colsB = a.oldB.concat(new Array(a.n).fill(a.color));
      hsB = []; for (let k = 0; k < CAPN; k++) { const run = k - a.oldB.length; hsB.push(run < 0 ? 1 : Math.max(0, Math.min(1, a.n * p - run))); }
      // chorro: del borde a la superficie del tubo destino
      const surf = BASE + LH * (a.oldB.length + a.n * p), top = lip.y - 0.12, len = Math.max(0.05, top - surf);
      const w = 0.06 * Math.min(1, p * 8, (1 - p) * 8 + 0.2);
      stream.visible = true; stream.material = mats.liq[a.color];
      stream.scale.set(w, len, w); stream.position.set(lip.x, surf + len / 2, lip.z);
    } else {
      const u = ease((a.t - T1 - T2) / T3), p1 = pivotFor(a, TH1);
      th = TH1 * (1 - u);
      px = p1[0] * (1 - u) + sa.x * u; py = p1[1] * (1 - u);
      stream.visible = false;
    }
    sa.dx = px - sa.x; sa.dy = py; sa.dz = 0; sa.lift = 0; sa.rz = -a.dir * th;
    // el tubo destino muestra las capas según la fase
    if (a.t < T1) { setLayers(sb, a.oldB, ones); setLayers(sa, a.oldA, ones); }
    else if (a.t < T1 + T2) { setLayers(sa, a.oldA, hsA); setLayers(sb, colsB, hsB); }
    else { setLayers(sa, tubes[a.ia], ones); setLayers(sb, tubes[a.ib], ones); }
    if (a.t >= tEnd) return false;
    return true;
  }

  function loop(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - (loop.t || now)) / 1000); loop.t = now;
    let work = false;
    slots.forEach((s, i) => {
      if (s.intro < 1) { s.intro += dt; if (s.intro < 0.45) work = true; else s.intro = 1; }
      if (anim && (i === anim.ia)) return;
      const goal = i === sel ? LIFT : 0;
      if (Math.abs(s.lift - goal) > 0.001) { const d = dt * 5; s.lift += Math.max(-d, Math.min(d, goal - s.lift)); work = true; } else s.lift = goal;
      if (s.wob > 0) { s.wob = Math.max(0, s.wob - dt * 3); work = true; }
      if (s.hop) { s.hop += dt * 2.2; if (s.hop >= 1) s.hop = 0; else work = true; }
    });
    if (anim) {
      if (stepAnim(dt)) work = true;
      else endAnim();
    }
    draw();
    if (work || anim) raf = requestAnimationFrame(loop);
  }
  function kick() { if (!raf) { loop.t = 0; raf = requestAnimationFrame(loop); } }

  function endAnim() {
    const sa = slots[anim.ia];
    sa.dx = sa.dy = sa.dz = sa.rz = 0; sa.lift = 0;
    anim = null; busy = false;
    if (stream) stream.visible = false;
    syncAll(); updateHud();
    if (L.isSolved(tubes)) {
      over = true; updateHud();
      slots.forEach((s, i) => { if (s.done) s.hop = 0.001 + i * 0 ; });
      kick(); setTimeout(() => finish(), 700);
    }
  }

  /* ---------- Entrada: el toque elige el tubo cuyo eje (en pantalla) queda más cerca ---------- */
  function pick(cx, cy) {
    let best = -1, bd = Math.max(24, pxPerUnit * DX * 0.55);
    slots.forEach((s, i) => {
      const a = proj(s.x, 0.2, s.z), b = proj(s.x, GH + (i === sel ? LIFT : 0), s.z);
      const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1;
      const t = Math.max(0, Math.min(1, ((cx - a[0]) * dx + (cy - a[1]) * dy) / l2));
      const d = Math.hypot(cx - (a[0] + dx * t), cy - (a[1] + dy * t));
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  cv.addEventListener("pointerdown", (ev) => {
    if (!glOk || !lv || over || busy || overlay.classList.contains("on")) return;
    const i = pick(ev.clientX, ev.clientY);
    if (i >= 0) tap(i);
  });

  function tap(i) {
    if (busy || over) return;
    $("msg").textContent = "";
    if (sel === -1) { if (tubes[i].length) { sel = i; Arcade.haptic("light"); kick(); } return; }
    if (sel === i) { sel = -1; kick(); return; }
    if (!L.canPour(tubes, sel, i)) {
      $("msg").textContent = "No se puede verter ahí";
      Arcade.haptic("error");
      slots[i].wob = 1;
      sel = tubes[i].length ? i : -1; kick(); return;
    }
    doPour(sel, i);
  }

  /* ---------- Botones ---------- */
  $("undoBtn").onclick = () => {
    if (busy || over || !history.length) return;
    tubes = history.pop(); sel = -1; syncAll(); updateHud(); kick();
  };
  $("resetBtn").onclick = () => { if (!busy) startLevel(cur); };
  $("addBtn").onclick = async () => {
    if (added || busy || over) return;
    const ok = await Ads.rewarded(); if (!ok) return;
    added = true; sel = -1;
    tubes = tubes.map((t) => t.slice()); tubes.push([]);
    // los estados anteriores del historial se amplían con un tubo vacío para que deshacer no lo pierda
    history = history.map((h) => h.concat([[]]));
    buildScene(false); resize(); updateHud();
  };

  /* ---------- Fin de nivel ---------- */
  function finish() {
    const st = liveStars();
    if (!progress.stars[cur] || st > progress.stars[cur]) progress.stars[cur] = st;
    progress.completed = (progress.completed || 0) + 1; save();
    Arcade.submitScore("stars", totalStars());
    Arcade.haptic("success");
    $("ovStars").textContent = "★".repeat(st) + "☆".repeat(3 - st);
    $("ovInfo").textContent = history.length + " movimientos (referencia: " + lv.ref + ")";
    $("bNext").style.display = cur < LEVELS.length - 1 ? "" : "none";
    setTimeout(async () => {
      if (progress.completed % 3 === 0) await Ads.interstitial(); // anuncio cada 3 niveles
      overlay.classList.add("on");
    }, 200);
  }

  $("symChk").onchange = (e) => { progress.sym = e.target.checked; applySym(); save(); };
  $("menuBtn").onclick = () => { buildMenu(); show("menu"); };
  $("bMenu").onclick = () => { overlay.classList.remove("on"); buildMenu(); show("menu"); };
  $("bRetry").onclick = () => startLevel(cur);
  $("bNext").onclick = () => startLevel(Math.min(cur + 1, LEVELS.length - 1));

  Arcade.on("pause", () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } });
  Arcade.on("resume", () => { if (glOk && lv) kick(); });

  Arcade.ready().then(function (session) {
    const s = session.state;
    if (s && typeof s === "object" && s.stars && typeof s.stars === "object") {
      progress = { stars: s.stars, completed: s.completed || 0, sym: !!s.sym };
    }
    $("symChk").checked = !!progress.sym;
    buildMenu();
  });

  // Para pruebas: estado, toque por índice y posición en pantalla de cada tubo
  window.__ws = {
    get tubes() { return tubes; }, get sel() { return sel; }, get busy() { return busy; }, get over() { return over; },
    startLevel: startLevel, tap: tap,
    tubeToScreen: function (i) { const s = slots[i]; return proj(s.x, GH * 0.5, s.z); }
  };
})();
</script>
</body>
</html>
