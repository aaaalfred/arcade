<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arrows Escape</title>
<style>
  :root {
    --bg:#fdfaf2; --ink:#2e473f; --panel:#ffffff; --line:#e6dfcf; --muted:#7d877f; --text:#26332d;
    --star:#f4a320; --star-off:#ddd6c4; --green:#3f8a52; --red:#d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14201c; --ink:#cfe3d8; --panel:#1f2e29; --line:#33463e; --muted:#8fa299; --text:#e8f1ec;
      --star-off:#3a4a43; --green:#5fcf85; --red:#ff7a72;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14201c; --ink:#cfe3d8; --panel:#1f2e29; --line:#33463e; --muted:#8fa299; --text:#e8f1ec;
    --star-off:#3a4a43; --green:#5fcf85; --red:#ff7a72;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; overscroll-behavior:none; touch-action:manipulation; }
  #app { max-width:520px; margin:0 auto; height:100%; display:flex; flex-direction:column; padding:10px 16px 14px; }
  .screen { display:none; flex:1; flex-direction:column; min-height:0; }
  .screen.on { display:flex; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; cursor:pointer; min-height:44px; }
  button:active { transform:scale(.96); }
  button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:bold; }
  button:disabled { opacity:.4; }

  /* menú */
  h1 { font-size:22px; margin:14px 0 6px; text-align:center; color:var(--ink); }
  .intro { text-align:center; color:var(--muted); margin:0 0 18px; line-height:1.4; font-size:14px; }
  #grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  #grid button { padding:14px 0; font-size:18px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  #grid button small { font-size:12px; color:var(--star); letter-spacing:1px; min-height:14px; }
  #grid button.locked { opacity:.35; }

  /* juego */
  .top { display:flex; align-items:center; justify-content:space-between; min-height:48px; }
  .top .side { width:76px; }
  .top .side:last-child { text-align:right; color:var(--muted); font-size:13px; }
  #menuBtn { padding:6px 10px; font-size:18px; min-width:44px; }
  #hearts { display:flex; gap:6px; font-size:28px; line-height:1; }
  #hearts span { color:var(--red); transition:color .25s, transform .25s; }
  #hearts span.off { color:var(--star-off); transform:scale(.85); }
  #boardWrap { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #noGL { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--muted); }
  #zoomBtns { position:absolute; right:0; top:4px; display:flex; flex-direction:column; gap:8px; }
  #zoomBtns button { width:44px; height:44px; padding:0; font-size:20px; opacity:.92; }
  #info { text-align:center; color:var(--muted); font-size:13px; min-height:18px; margin-bottom:4px; }
  .bottom { display:flex; justify-content:center; padding-top:6px; }
  #hintBtn { position:relative; width:58px; height:58px; padding:0; border-radius:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  #hintBtn svg { width:30px; height:30px; }
  #hintCount { position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; border-radius:11px; background:#5cb82a; color:#fff; font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center; padding:0 5px; border:2px solid var(--bg); }

  /* ventana de fin de nivel */
  #overlay { position:fixed; inset:0; background:rgba(20,32,28,.55); display:none; align-items:center; justify-content:center; padding:24px; }
  #overlay.on { display:flex; }
  .card { background:var(--panel); border-radius:18px; padding:22px; width:100%; max-width:340px; text-align:center; border:1px solid var(--line); }
  .card h2 { margin:0 0 6px; color:var(--ink); }
  .big-stars { font-size:36px; color:var(--star); letter-spacing:4px; margin:8px 0; }
  .card .row { display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
</style>
</head>
<body>
<div id="app">

  <section id="sMenu" class="screen on">
    <h1>Arrows Escape</h1>
    <p class="intro">Toca una flecha para que escape del tablero.<br>Si algo le cierra el paso, pierdes un corazón.<br>Los bloques fijos nunca se mueven.<br>Pellizca para acercar y arrastra para mover.</p>
    <div id="grid"></div>
  </section>

  <section id="sGame" class="screen">
    <div class="top">
      <div class="side"><button id="menuBtn" aria-label="Niveles">☰</button></div>
      <div id="hearts"><span>♥</span><span>♥</span><span>♥</span></div>
      <div class="side">Nivel <b id="lvNum">1</b><br><span id="timer"></span></div>
    </div>
    <div id="boardWrap">
      <canvas id="cv"></canvas>
      <div id="noGL">No se pudo iniciar el modo 3D en este dispositivo.</div>
      <div id="zoomBtns"><button id="zIn" aria-label="Acercar">+</button><button id="zOut" aria-label="Alejar">−</button><button id="zFit" aria-label="Ajustar">⤢</button></div>
    </div>
    <div id="info">Quedan <b id="left">0</b> flechas <span id="msg"></span></div>
    <div class="bottom">
      <button id="hintBtn" aria-label="Pista">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3f8a52" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" fill="#3f8a52" fill-opacity=".85"/>
        </svg>
        <span id="hintCount">3</span>
      </button>
    </div>
  </section>
</div>

<div id="overlay"><div class="card">
  <h2 id="ovTitle">¡Nivel completo!</h2>
  <div class="big-stars" id="ovStars"></div>
  <div id="ovInfo" style="color:var(--muted)"></div>
  <div class="row">
    <button id="bMenu">Niveles</button>
    <button id="bRetry">Repetir</button>
    <button id="bNext" class="primary">Siguiente</button>
  </div>
</div></div>

<script src="../_sdk/arcade-sdk.js" data-game="arrows-escape"></script>
<script src="../_sdk/three.min.js"></script>
<script src="logic.js"></script>
<script src="levels.js"></script>
<script>
(function () {
  "use strict";
  const L = window.Logic, LEVELS = window.LEVELS_DATA;
  const LIVES = 3, HINTS = 3;

  /* Anuncios: los gestiona la app (frecuencia, consentimiento, AdMob). El juego solo los pide. */
  const Ads = {
    interstitial: function () { return Arcade.ads.interstitial(); },
    rewarded: function () { return Arcade.ads.rewarded(); }
  };

  /* ---------- Progreso guardado (lo persiste y sincroniza la app mediante el SDK) ---------- */
  let progress = { stars: {}, completed: 0 };
  const levelsDone = () => Object.keys(progress.stars).length;
  const totalStars = () => Object.keys(progress.stars).reduce(function (n, k) { return n + (progress.stars[k] || 0); }, 0);
  function save() { Arcade.save(progress, { progress: { value: levelsDone(), total: LEVELS.length } }); }

  const $ = (id) => document.getElementById(id);
  const sMenu = $("sMenu"), sGame = $("sGame"), cv = $("cv"), overlay = $("overlay");

  /* ---------- Estado de la partida ---------- */
  let cur = 0, lv = null, arrows = [], obstacles = [], lives = LIVES, hints = HINTS, hintIdx = -1, over = false, mistakes = 0, raf = 0;
  let timeLeft = 0, timerId = 0, paused = false;
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function buildMenu() {
    const g = $("grid"); g.innerHTML = "";
    LEVELS.forEach((l, i) => {
      const unlocked = i === 0 || progress.stars[i - 1] !== undefined;
      const st = progress.stars[i] || 0;
      const b = document.createElement("button");
      b.innerHTML = (i + 1) + "<small>" + (st ? "★".repeat(st) + "☆".repeat(3 - st) : "") + "</small>";
      if (!unlocked) { b.className = "locked"; b.disabled = true; }
      b.onclick = () => startLevel(i);
      g.appendChild(b);
    });
  }
  function show(screen) { sMenu.classList.toggle("on", screen === "menu"); sGame.classList.toggle("on", screen === "game"); }

  function startLevel(i) {
    cur = i; lv = LEVELS[i]; lives = LIVES; hints = HINTS; hintIdx = -1; over = false; mistakes = 0;
    overlay.classList.remove("on"); $("msg").textContent = ""; $("lvNum").textContent = lv.id;
    show("game"); clearInterval(timerId); timeLeft = lv.time || 0;
    if (timeLeft) timerId = setInterval(tick, 1000);
    arrows = lv.arrows.map((cells) => ({ cells, alive: true, anim: null, shake: 0, bad: 0 })); // para el HUD antes del GL
    updateHud();
    if (!initGL()) return;
    buildScene();
    resize(true);
    kick();
  }

  function tick() {
    if (over) { clearInterval(timerId); return; }
    if (paused) return;
    timeLeft--; updateHud();
    if (timeLeft <= 0) { clearInterval(timerId); over = true; $("msg").textContent = "¡Se acabó el tiempo!"; updateHud(); setTimeout(() => finish(false), 400); }
  }
  function updateHud() {
    $("left").textContent = arrows.filter((a) => a.alive).length;
    const t = $("timer"); t.textContent = lv && lv.time ? "Tiempo " + Math.floor(Math.max(0, timeLeft) / 60) + ":" + String(Math.max(0, timeLeft) % 60).padStart(2, "0") : "";
    [...$("hearts").children].forEach((s, k) => s.classList.toggle("off", k >= lives));
    $("hintCount").textContent = hints;
    $("hintBtn").disabled = hints <= 0 || over;
  }

  /* =====================================================================
   * Presentación 3D (three.js, vendorizado en ../_sdk/three.min.js)
   * Unidades del mundo: 1 celda = 1. x = columna, z = fila, y = altura.
   * ===================================================================== */
  const R_BODY = 0.17, R_HEAD = 0.36, H_HEAD = 0.52, Y_REST = 0.2, ELEV = 62, MAX_ZOOM = 4, MIN_ZOOM = 0.85;
  let renderer = null, scene, camera, hemi, sun, boardGroup, arrowsGroup, plane;
  let geoCyl, geoSph, geoCone, geoBlock, glOk = null, T = {};
  let slabMat, rimMat, dotMat, blockMat, blockBad, cableMat;
  let V = { zoom: 1, x: 0, z: 0, dist: 20 };   // vista: zoom, centro (x,z) y distancia de encuadre

  function initGL() {
    if (glOk !== null) return glOk;
    try {
      if (!window.THREE) throw new Error("three.js no cargó");
      renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setClearColor(0x000000, 0);
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(30, 1, 0.5, 400);
      hemi = new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.85); scene.add(hemi);
      sun = new THREE.DirectionalLight(0xffffff, 0.9);
      sun.position.set(-4, 12, 6); sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
      scene.add(sun, sun.target);
      boardGroup = new THREE.Group(); arrowsGroup = new THREE.Group(); scene.add(boardGroup, arrowsGroup);
      geoCyl = new THREE.CylinderGeometry(1, 1, 1, 14);
      geoSph = new THREE.SphereGeometry(1, 16, 12);
      geoCone = new THREE.ConeGeometry(R_HEAD, H_HEAD, 18);
      geoBlock = new THREE.BoxGeometry(0.78, 0.6, 0.78);
      plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -Y_REST);
      cv.addEventListener("webglcontextlost", (e) => e.preventDefault());
      cv.addEventListener("webglcontextrestored", () => draw());
      glOk = true;
    } catch (err) {
      glOk = false; $("noGL").style.display = "flex"; cv.style.display = "none"; $("zoomBtns").style.display = "none";
      if (window.console) console.warn("[arrows-escape] WebGL no disponible:", err);
    }
    return glOk;
  }

  const wp = (r, c) => [c - (lv.w - 1) / 2, r - (lv.h - 1) / 2];   // celda -> [x, z]

  function readTheme() {
    T = { ink: cssVar("--ink") || "#2e473f", green: cssVar("--green") || "#3f8a52", red: cssVar("--red") || "#d9534f",
          panel: cssVar("--panel") || "#ffffff", line: cssVar("--line") || "#e6dfcf", muted: cssVar("--muted") || "#7d877f" };
    T.dark = new THREE.Color(cssVar("--bg") || "#fff").getHSL({}).l < 0.5;
    T.sig = T.ink + T.panel + T.line;
  }
  // Aplica los colores del tema a los materiales compartidos (también al cambiar claro/oscuro en vivo)
  function applyTheme() {
    if (!slabMat) return;
    slabMat.color.set(T.panel); rimMat.color.set(T.line);
    dotMat.color.set(T.line).lerp(new THREE.Color(T.ink), 0.3);
    blockMat.color.set(T.dark ? T.muted : T.ink).lerp(new THREE.Color(T.muted), T.dark ? 0 : 0.55).multiplyScalar(T.dark ? 0.6 : 1);
    blockBad.color.set(T.red);
  }

  function disposeGroup(g) {
    while (g.children.length) {
      const o = g.children.pop();
      if (o.userData.ownGeo && o.geometry) o.geometry.dispose();
    }
  }

  // Tablero (losa + borde + puntos), obstáculos y flechas del nivel actual
  function buildScene() {
    readTheme();
    disposeGroup(boardGroup);
    arrowsGroup.children.slice().forEach((g) => arrowsGroup.remove(g));
    if (!slabMat) {
      slabMat = new THREE.MeshStandardMaterial({ roughness: 0.85 });
      rimMat = new THREE.MeshStandardMaterial({ roughness: 0.9 });
      dotMat = new THREE.MeshBasicMaterial();
      blockMat = new THREE.MeshStandardMaterial({ roughness: 0.8 });
      blockBad = new THREE.MeshStandardMaterial({ roughness: 0.6 });
    }
    applyTheme();

    const bw = lv.w + 1.0, bh = lv.h + 1.0;
    const slab = new THREE.Mesh(new THREE.BoxGeometry(bw, 0.5, bh), slabMat);
    slab.position.y = -0.25; slab.receiveShadow = true; slab.userData = { ownGeo: true };
    const rim = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.3, 0.3, bh + 0.3), rimMat);
    rim.position.y = -0.62; rim.userData = { ownGeo: true };
    const dots = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.07, 0.07, 0.02, 10), dotMat, lv.w * lv.h);
    const m = new THREE.Matrix4();
    for (let r = 0; r < lv.h; r++) for (let c = 0; c < lv.w; c++) { const p = wp(r, c); m.setPosition(p[0], 0.011, p[1]); dots.setMatrixAt(r * lv.w + c, m); }
    dots.userData = { ownGeo: true };
    boardGroup.add(slab, rim, dots);

    obstacles = (lv.obstacles || []).map(([r, c]) => {
      const p = wp(r, c), b = new THREE.Mesh(geoBlock, blockMat);
      b.position.set(p[0], 0.3, p[1]); b.castShadow = true; b.receiveShadow = true;
      b.userData = { r, c, bad: 0 };
      boardGroup.add(b);
      return b;
    });

    const half = Math.max(lv.w, lv.h) / 2 + 2;
    const sc = sun.shadow.camera; sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 1; sc.far = 40; sc.updateProjectionMatrix();
    sun.position.set(-half * 0.5, 12, half * 0.8); sun.target.position.set(0, 0, 0);

    arrows.forEach((a) => a.mat && a.mat.dispose());
    arrows = lv.arrows.map((cells, i) => {
      const a = { cells, alive: true, anim: null, shake: 0, bad: 0, intro: lv.arrows.length <= 40 ? { t: -Math.min(i, 30) * 0.03 } : null, group: new THREE.Group(),
                  mat: new THREE.MeshStandardMaterial({ color: T.ink, roughness: 0.45, metalness: 0.05 }) };
      a.geo = prep(a);
      arrowsGroup.add(a.group); rebuild(a, 0);
      return a;
    });
    V.zoom = 1; V.x = 0; V.z = 0;
  }

  /* ---------- Geometría de cada flecha (polilínea en unidades de celda) ---------- */
  function prep(a) {
    const pts = a.cells.map(([r, c]) => wp(r, c));
    const [dr, dc] = L.headDir(a.cells), h = pts[pts.length - 1], far = (lv.w + lv.h) * 2 + 10;
    pts.push([h[0] + dc * far, h[1] + dr * far]);
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { pts, cum, len: a.cells.length - 1, dEdge: L.rayCells(lv, a.cells).length + 0.5, dir: [dc, dr] };
  }
  function pointAt(pts, cum, d) {
    d = Math.max(0, Math.min(cum[cum.length - 1], d));
    let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
    const t = (d - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
    return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
  }
  function slice(pts, cum, a, b) {
    const out = [pointAt(pts, cum, a)];
    for (let i = 0; i < pts.length; i++) if (cum[i] > a && cum[i] < b) out.push(pts[i]);
    out.push(pointAt(pts, cum, b));
    return out;
  }

  const UP = new THREE.Vector3(0, 1, 0), v1 = new THREE.Vector3();
  function mesh(geo, a) { const m = new THREE.Mesh(geo, a.mat); m.castShadow = true; return m; }

  // Reconstruye las mallas de la flecha para el desplazamiento s (tubos + esferas + cono en la punta)
  function rebuild(a, s) {
    const g = a.group;
    while (g.children.length) g.remove(g.children[g.children.length - 1]);
    const sl = slice(a.geo.pts, a.geo.cum, s, s + a.geo.len);
    for (let i = 0; i < sl.length; i++) {
      const p = sl[i], j = mesh(geoSph, a);
      j.scale.setScalar(R_BODY); j.position.set(p[0], Y_REST, p[1]); g.add(j);
      if (i === 0) continue;
      const q = sl[i - 1], dx = p[0] - q[0], dz = p[1] - q[1], d = Math.hypot(dx, dz);
      if (d < 1e-4) continue;
      const seg = mesh(geoCyl, a);
      seg.scale.set(R_BODY, d, R_BODY);
      seg.position.set((p[0] + q[0]) / 2, Y_REST, (p[1] + q[1]) / 2);
      seg.quaternion.setFromUnitVectors(UP, v1.set(dx / d, 0, dz / d));
      g.add(seg);
    }
    const e = sl[sl.length - 1], pr = sl[sl.length - 2] || sl[0];
    let dx = e[0] - pr[0], dz = e[1] - pr[1]; const mg = Math.hypot(dx, dz) || 1; dx /= mg; dz /= mg;
    const cone = mesh(geoCone, a);
    cone.position.set(e[0] + dx * 0.2, Y_REST, e[1] + dz * 0.2);
    cone.quaternion.setFromUnitVectors(UP, v1.set(dx, 0, dz));
    g.add(cone);
  }

  /* ---------- Cámara: inclinada, encuadra el tablero completo; zoom y desplazamiento opcionales ---------- */
  const EL = ELEV * Math.PI / 180;
  function placeCamera() {
    const d = V.dist / V.zoom;
    camera.position.set(V.x, d * Math.sin(EL), V.z + d * Math.cos(EL));
    camera.lookAt(V.x, 0, V.z);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  }
  function fitDistance() {
    const hw = lv.w / 2 + 0.9, hh = lv.h / 2 + 0.9;
    const corners = [[-hw, 0, -hh], [hw, 0, -hh], [-hw, 0, hh], [hw, 0, hh], [-hw, 0.6, -hh], [hw, 0.6, -hh]];
    let lo = 2, hi = 400;
    for (let k = 0; k < 28; k++) {
      const D = (lo + hi) / 2;
      camera.position.set(0, D * Math.sin(EL), D * Math.cos(EL)); camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      const fits = corners.every((c) => { v1.set(c[0], c[1], c[2]).project(camera); return Math.abs(v1.x) <= 0.97 && Math.abs(v1.y) <= 0.97; });
      if (fits) hi = D; else lo = D;
    }
    return hi;
  }
  function clampView() {
    V.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, V.zoom));
    const mx = lv.w / 2 + 0.5, mz = lv.h / 2 + 0.5;
    V.x = Math.max(-mx, Math.min(mx, V.x)); V.z = Math.max(-mz, Math.min(mz, V.z));
    if (V.zoom <= 1) { V.x *= 0.0; V.z *= 0.0; }
  }
  function resize(refit) {
    if (!lv || !glOk) return;
    const wrap = $("boardWrap"), W = Math.max(200, wrap.clientWidth), H = Math.max(200, wrap.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    V.dist = fitDistance();
    if (refit) { V.zoom = 1; V.x = 0; V.z = 0; }
    clampView(); placeCamera(); draw();
  }
  window.addEventListener("resize", () => { if (sGame.classList.contains("on")) resize(); });

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
  function groundAt(clientX, clientY, out) {
    const rect = cv.getBoundingClientRect();
    ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    return ray.ray.intersectPlane(plane, out) ? out : null;
  }
  // Cambia el zoom manteniendo fijo el punto del tablero bajo (cx, cy) de la pantalla
  function zoomAt(f, cx, cy) {
    const p0 = groundAt(cx, cy, new THREE.Vector3());
    V.zoom *= f; clampView(); placeCamera();
    const p1 = p0 && groundAt(cx, cy, new THREE.Vector3());
    if (p0 && p1) { V.x += p0.x - p1.x; V.z += p0.z - p1.z; clampView(); placeCamera(); }
    draw();
  }
  function zoomCenter(f) { const r = cv.getBoundingClientRect(); zoomAt(f, r.left + r.width / 2, r.top + r.height / 2); }
  $("zIn").onclick = () => zoomCenter(1.4);
  $("zOut").onclick = () => zoomCenter(1 / 1.4);
  $("zFit").onclick = () => { V.zoom = 1; V.x = 0; V.z = 0; clampView(); placeCamera(); draw(); };

  // Para pruebas E2E: posición en pantalla (px de página del iframe) del centro de una celda
  window.__arrowsEscapeCellToScreen = function (r, c) {
    const rect = cv.getBoundingClientRect(), p = wp(r, c);
    v1.set(p[0], Y_REST, p[1]).project(camera);
    return [rect.left + (v1.x + 1) / 2 * rect.width, rect.top + (1 - v1.y) / 2 * rect.height];
  };

  function draw() {
    if (!glOk || !lv) return;
    const k = T.dark ? 0.78 : 1;
    const ink = new THREE.Color(T.ink).multiplyScalar(k), green = new THREE.Color(T.green), red = new THREE.Color(T.red);
    arrows.forEach((a, i) => {
      a.group.visible = a.alive || !!a.anim;
      if (!a.group.visible) return;
      a.mat.color.copy(a.bad > 0 ? red : (i === hintIdx ? green : ink));
      let ox = 0, oz = 0, oy = 0;
      if (a.shake > 0) { const q = Math.sin(a.shake * 40) * 0.12 * a.shake; ox = a.geo.dir[0] * q; oz = a.geo.dir[1] * q; }
      if (a.intro) { const p = Math.max(0, Math.min(1, a.intro.t / 0.5)); oy = Math.pow(1 - p, 3) * 3; }
      a.group.position.set(ox, oy, oz);
    });
    obstacles.forEach((b) => { b.material = b.userData.bad > 0 ? blockBad : blockMat; });
    renderer.render(scene, camera);
  }

  /* ---------- Animación (solo mientras haya algo en movimiento) ---------- */
  function loop(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - (loop.t || now)) / 1000); loop.t = now;
    let busy = false;
    arrows.forEach((a) => {
      if (a.intro) { a.intro.t += dt; if (a.intro.t >= 0.5) a.intro = null; else busy = true; }
      if (a.anim) {
        a.anim.s += 16 * dt * (0.4 + a.anim.s / 6);
        const g = a.geo, end = g.len + g.dEdge + 3;
        if (a.anim.s >= end) { a.anim = null; updateHud(); }
        else {
          rebuild(a, a.anim.s);
          const f = Math.max(0, Math.min(1, (a.anim.s - g.dEdge) / (g.len + 3)));
          a.mat.transparent = f > 0; a.mat.opacity = 1 - f;
          busy = true;
        }
      }
      if (a.shake > 0) { a.shake = Math.max(0, a.shake - dt * 3); busy = true; }
      if (a.bad > 0) { a.bad = Math.max(0, a.bad - dt * 2.2); busy = true; }
    });
    obstacles.forEach((b) => { if (b.userData.bad > 0) { b.userData.bad = Math.max(0, b.userData.bad - dt * 2.2); busy = true; } });
    draw();
    if (busy) raf = requestAnimationFrame(loop);
    else checkEnd();
  }
  function kick() { if (!raf) { loop.t = 0; raf = requestAnimationFrame(loop); } }

  /* ---------- Entrada: toque = proyectar sobre el plano del tablero; arrastre = mover; pellizco = zoom ---------- */
  function distSeg(x, y, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / l2));
    return Math.hypot(x - (a[0] + dx * t), y - (a[1] + dy * t));
  }
  const ptrs = new Map(); let drag = null, pinch = null;
  const hitA = new THREE.Vector3(), hitB = new THREE.Vector3();
  cv.addEventListener("pointerdown", (ev) => {
    if (!glOk || !lv || overlay.classList.contains("on")) return;
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]);
    if (ptrs.size === 1) drag = { x0: ev.clientX, y0: ev.clientY, moved: false };
    else { drag = null; const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1 }; }
  });
  cv.addEventListener("pointermove", (ev) => {
    const prev = ptrs.get(ev.pointerId); if (!prev) return;
    const cur2 = [ev.clientX, ev.clientY]; ptrs.set(ev.pointerId, cur2);
    if (ptrs.size >= 2 && pinch) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
      zoomAt(d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch.d = d;
    } else if (drag) {
      if (!drag.moved && Math.hypot(cur2[0] - drag.x0, cur2[1] - drag.y0) > 8) drag.moved = true;
      if (drag.moved && V.zoom > 1.001 && groundAt(prev[0], prev[1], hitA) && groundAt(cur2[0], cur2[1], hitB)) {
        V.x += hitA.x - hitB.x; V.z += hitA.z - hitB.z; clampView(); placeCamera(); draw();
      }
    }
  });
  function up(ev) {
    if (!ptrs.has(ev.pointerId)) return;
    const p = ptrs.get(ev.pointerId); ptrs.delete(ev.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (drag && !drag.moved && ev.type === "pointerup") tapAt(p[0], p[1]);
    if (ptrs.size === 0) drag = null;
  }
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", (ev) => { ev.preventDefault(); zoomAt(ev.deltaY < 0 ? 1.15 : 1 / 1.15, ev.clientX, ev.clientY); }, { passive: false });

  function tapAt(cx, cy) {
    if (over || !groundAt(cx, cy, hit)) return;
    // radio tocable en celdas; en pantallas pequeñas con tableros grandes se amplía para alcanzar ~20 px
    const rect = cv.getBoundingClientRect();
    const px1 = groundAt(rect.left + rect.width / 2 + 20, rect.top + rect.height / 2, new THREE.Vector3());
    const p0 = groundAt(rect.left + rect.width / 2, rect.top + rect.height / 2, new THREE.Vector3());
    const r20 = px1 && p0 ? Math.abs(px1.x - p0.x) : 0.55;
    let best = -1, bd = Math.max(0.55, Math.min(1.0, r20));
    arrows.forEach((a, i) => {
      if (!a.alive || a.anim) return;
      const pts = a.cells.map(([r, c]) => wp(r, c));
      for (let k = 1; k < pts.length; k++) { const d = distSeg(hit.x, hit.z, pts[k - 1], pts[k]); if (d < bd) { bd = d; best = i; } }
    });
    if (best >= 0) tapArrow(best);
  }

  function tapArrow(i) {
    const a = arrows[i];
    const alive = arrows.map((o) => o.alive);
    const occ = L.occupancy(lv, alive);
    const blk = L.blocker(lv, i, occ);
    if (blk === -1) {
      a.alive = false; a.anim = { s: 0 }; updateHud();
      if (hintIdx === i) hintIdx = -1;
      $("msg").textContent = "";
    } else {
      a.shake = 1; a.bad = 1;
      if (blk >= 0) arrows[blk].bad = 0.6;
      else { // bloque fijo: se marca el que cierra el paso
        const ob = new Set((lv.obstacles || []).map(([r, c]) => L.key(r, c)));
        const cell = L.rayCells(lv, a.cells).find(([r, c]) => ob.has(L.key(r, c)));
        const b = cell && obstacles.find((o) => o.userData.r === cell[0] && o.userData.c === cell[1]);
        if (b) b.userData.bad = 1;
        $("msg").textContent = "¡Un bloque fijo la detiene!";
      }
      lives--; mistakes++; updateHud();
      Arcade.haptic("error");
      if (lives <= 0) { over = true; clearInterval(timerId); updateHud(); setTimeout(() => finish(false), 600); }
    }
    kick();
  }

  function checkEnd() {
    if (!over && arrows.every((a) => !a.alive && !a.anim)) { over = true; clearInterval(timerId); updateHud(); setTimeout(() => finish(true), 250); }
  }

  /* ---------- Pista ---------- */
  $("hintBtn").onclick = async () => {
    if (over || hints <= 0 || !glOk) return;
    const free = L.freeArrows(lv, arrows.map((a) => a.alive));
    if (!free.length) return;
    if (hintIdx === -1) { // una pista nueva solo si no hay una a la vista
      const ok = await Ads.rewarded(); if (!ok) return;
      hints--; hintIdx = free[0];
      if (V.zoom > 1.001) { // centra la vista en la flecha señalada
        const h = arrows[hintIdx].cells[arrows[hintIdx].cells.length - 1], p = wp(h[0], h[1]);
        V.x = p[0]; V.z = p[1]; clampView(); placeCamera();
      }
      updateHud(); draw();
    }
  };

  /* ---------- Fin de nivel ---------- */
  function finish(won) {
    if (won) {
      const st = Math.max(1, lives);
      if (!progress.stars[cur] || st > progress.stars[cur]) progress.stars[cur] = st;
      progress.completed = (progress.completed || 0) + 1; save();
      Arcade.submitScore("stars", totalStars());
      Arcade.haptic("success");
      $("ovTitle").textContent = "¡Nivel completo!";
      $("ovStars").textContent = "★".repeat(st) + "☆".repeat(3 - st);
      $("ovInfo").textContent = mistakes ? "Corazones perdidos: " + mistakes : "¡Sin errores!";
      $("bNext").style.display = cur < LEVELS.length - 1 ? "" : "none";
    } else {
      $("ovTitle").textContent = lv.time && timeLeft <= 0 ? "Tiempo agotado" : "Sin corazones";
      $("ovStars").textContent = "☆☆☆";
      $("ovInfo").textContent = "Inténtalo de nuevo";
      $("bNext").style.display = "none";
    }
    setTimeout(async () => {
      if (won && progress.completed % 3 === 0) await Ads.interstitial(); // anuncio cada 3 niveles
      overlay.classList.add("on");
    }, 200);
  }

  $("menuBtn").onclick = () => { clearInterval(timerId); over = true; buildMenu(); show("menu"); };
  $("bMenu").onclick = () => { clearInterval(timerId); overlay.classList.remove("on"); buildMenu(); show("menu"); };
  $("bRetry").onclick = () => startLevel(cur);
  $("bNext").onclick = () => startLevel(Math.min(cur + 1, LEVELS.length - 1));

  // Cambio claro/oscuro en vivo
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onTheme = () => { if (glOk && lv) { readTheme(); applyTheme(); draw(); } };
    if (mq.addEventListener) mq.addEventListener("change", onTheme);
  }
  // La app pausa/reanuda (segundo plano, menú, anuncio): el cronómetro se detiene
  if (Arcade.on) {
    Arcade.on("pause", function () { paused = true; });
    Arcade.on("resume", function () { paused = false; if (glOk && lv) draw(); });
    Arcade.on("settings", function () { if (glOk && lv) { readTheme(); applyTheme(); draw(); } });
  }

  Arcade.ready().then(function (session) {
    const s = session.state;
    if (s && typeof s === "object" && s.stars && typeof s.stars === "object") progress = { stars: s.stars, completed: s.completed || 0 };
    buildMenu();
  });
})();
</script>
</body>
</html>
